<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crown Elite Job Tracker</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Crown Elite colors: ivory, white, sage green, light sage, champagne gold, charcoal */
    --cream:#FAF8F1;--warm-white:#FFFFFF;--ink:#2E2E2E;--ink-light:#5E5B55;--ink-faint:#8A867E;
    --copper:#7D9470;--copper-dark:#677D5B;--copper-text:#4C6340;--copper-light:#DCE4D6;--copper-pale:#EEF2EA;
    --gold:#D4B483;--gold-text:#8C6B34;--gold-pale:#F6EEDF;
    --blue:#3F6488;--blue-light:#EAF0F5;--green:#4C6340;--green-light:#E4ECDF;
    --amber:#A87A2E;--amber-light:#F6EEDF;--red:#A0473A;--red-light:#F7E7E3;
    --border:#ECE7DC;--shadow:0 2px 8px rgba(46,46,46,0.06);--shadow-lg:0 8px 32px rgba(46,46,46,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}
  button,input,select,textarea{font-family:inherit;}
  a{color:var(--copper-text);}
  .header{background:var(--warm-white);border-bottom:1px solid var(--border);padding:0 14px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;min-height:58px;position:sticky;top:0;z-index:100;gap:8px;}
  .header-brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .header-icon{width:50px;height:24px;flex-shrink:0;display:block;}
  .header-title{font-family:'DM Serif Display',serif;color:var(--ink);font-size:18px;line-height:1.1;white-space:nowrap;}
  .header-sub{color:var(--gold-text);font-size:10px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .header-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
  .sync-status{padding:4px 9px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;}
  .sync-status.saving{background:var(--cream);color:var(--ink-faint);}
  .sync-status.saved{background:var(--copper-light);color:var(--copper-text);}
  .sync-status.error{background:var(--red-light);color:var(--red);}
  .btn{padding:9px 13px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;white-space:nowrap;}
  .btn-primary{background:var(--copper);color:white;}.btn-primary:hover{background:var(--copper-dark);}
  .btn-ghost{background:var(--warm-white);color:var(--ink);border:1px solid var(--border);}.btn-ghost:hover{background:var(--cream);}
  .btn-outline{background:white;color:var(--ink);border:1px solid var(--border);}.btn-outline:hover{background:var(--cream);}
  .btn-green{background:var(--green);color:white;}.btn-red{background:var(--red);color:white;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:default;}
  .tab-bar{background:white;border-bottom:1px solid var(--border);display:flex;padding:0 8px;overflow-x:auto;position:sticky;top:58px;z-index:90;}
  .tab-btn{padding:13px 12px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
  .tab-btn.active{color:var(--copper-text);border-bottom-color:var(--copper);}
  .tab-count{background:var(--copper);color:white;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:4px;}
  .tab-count.red{background:var(--red);}
  .banner{padding:8px 14px;font-size:13px;text-align:center;background:var(--amber-light);color:var(--gold-text);border-bottom:1px solid #E6D3B0;}
  .banner button{margin-left:8px;}
  .page{display:none;}.page.active{display:block;}
  .container{max-width:1200px;margin:0 auto;padding:0 14px;}
  .main{padding:16px 0 80px;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .search-input{flex:1;min-width:160px;max-width:320px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:white;font-size:14px;outline:none;}
  .search-input:focus{border-color:var(--copper);}
  .seg{display:flex;gap:3px;background:white;border:1px solid var(--border);border-radius:8px;padding:3px;}
  .seg button{padding:6px 10px;font-size:12px;border:none;border-radius:6px;background:none;color:var(--ink-light);cursor:pointer;font-weight:500;}
  .seg button.on{background:var(--copper);color:white;}
  .muted{color:var(--ink-faint);font-size:12px;}
  .master-table-wrap{background:white;border-radius:12px;border:1px solid var(--border);overflow:auto;box-shadow:var(--shadow);}
  .master-table{width:100%;border-collapse:collapse;font-size:12px;}
  .master-table th{background:var(--ink);color:#F3F0E8;font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;padding:10px;text-align:left;white-space:nowrap;}
  .master-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .master-table tr:last-child td{border-bottom:none;}
  .master-table tbody tr{cursor:pointer;}
  .master-table tbody tr:hover td{background:var(--copper-pale);}
  .addr-cell{font-weight:600;font-size:13px;white-space:nowrap;}
  .addr-city{font-size:11px;font-weight:400;color:var(--ink-faint);margin-top:1px;}
  .permit-cell{font-size:12px;color:var(--ink-light);font-family:ui-monospace,Menlo,monospace;}
  .insp-cell{text-align:center;min-width:60px;}
  .insp-dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .insp-dot.done{background:var(--green-light);color:var(--green);}
  .insp-dot.fail{background:var(--red);color:white;}
  .insp-dot.empty{background:var(--cream);color:var(--ink-faint);border:1px solid var(--border);font-size:9px;}
  .insp-date{font-size:9px;color:var(--ink-faint);margin-top:1px;display:block;white-space:nowrap;}
  .prog-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .prog-fill{height:100%;border-radius:3px;background:var(--copper);}
  .hello{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.15;color:var(--ink);}
  .hello-date{font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .gold-rule{width:36px;height:2px;background:var(--gold);margin:10px 0 12px;}
  .stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px;max-width:520px;}
  .stat{background:white;border:1px solid var(--border);border-radius:12px;padding:9px 11px;text-align:left;cursor:pointer;font-family:inherit;}
  .stat:hover{border-color:var(--copper-light);}
  .stat-label{font-size:11px;color:var(--ink-faint);}
  .stat-num{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.1;color:var(--ink);}
  .stat-num.red{color:var(--red);}
  .jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;}
  .job-card{background:white;border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;}
  .job-card.has-fail{border-color:var(--red);}
  .job-card-header{padding:13px 14px 9px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .job-address{font-weight:600;font-size:15px;line-height:1.3;}
  .job-lot{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .status-badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-active{background:var(--copper-light);color:var(--copper-text);}
  .status-complete{background:var(--green-light);color:var(--green);}
  .status-pending{background:var(--cream);color:var(--ink-light);border:1px solid var(--border);}
  .status-warranty{background:var(--gold-pale);color:var(--gold-text);}
  .job-card-body{padding:0 14px 11px;}
  .job-card-footer{padding:8px 14px;background:var(--cream);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-faint);gap:8px;}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .chip-red{background:var(--red-light);color:var(--red);}
  .chip-blue{background:var(--blue-light);color:var(--blue);}
  .chip-amber{background:var(--amber-light);color:var(--gold-text);}
  .chip-grey{background:var(--cream);color:var(--ink-light);border:1px solid var(--border);}
  .empty-state{text-align:center;padding:44px 20px;color:var(--ink-faint);font-size:14px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(46,46,46,0.45);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-backdrop.open{opacity:1;pointer-events:all;}
  .modal{background:white;border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);margin:auto;}
  .modal-header{padding:15px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .modal-title{font-family:'DM Serif Display',serif;font-size:19px;}
  .modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;font-size:14px;color:var(--ink-light);flex-shrink:0;}
  .modal-body{padding:15px 18px;}
  .modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
  .form-row{display:flex;gap:10px;}
  .form-row .form-group{flex:1;min-width:0;}
  .form-group{margin-bottom:11px;}
  .form-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-light);margin-bottom:4px;}
  .form-input,.form-select,.form-textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:15px;color:var(--ink);background:white;outline:none;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--copper);}
  .form-textarea{resize:vertical;min-height:70px;}
  .form-hint{font-size:12px;color:var(--ink-faint);margin-top:4px;}
  .detail-backdrop{position:fixed;inset:0;background:var(--cream);z-index:150;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;visibility:hidden;}
  .detail-backdrop.open{transform:translateX(0);visibility:visible;}
  .detail-header{background:white;border-bottom:1px solid var(--border);padding:11px 14px;padding-top:calc(11px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
  .back-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .detail-title-wrap{flex:1;min-width:0;}
  .detail-title{font-family:'DM Serif Display',serif;font-size:18px;line-height:1.2;color:var(--ink);text-decoration:none;display:inline-block;}
  .detail-title .pin{font-size:14px;margin-right:3px;}
  .detail-meta{font-size:12px;color:var(--ink-faint);margin-top:1px;}
  .detail-body{max-width:880px;margin:0 auto;padding:14px 14px 80px;}
  .action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .action-row .btn{flex:1;min-width:120px;padding:11px 10px;}
  .full-card{background:white;border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:12px;}
  .full-card-title{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-light);margin-bottom:10px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .project-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .project-num{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:600;letter-spacing:.5px;user-select:all;-webkit-user-select:all;padding:4px 10px;background:var(--cream);border:1px solid var(--border);border-radius:8px;}
  .wd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:white;margin-bottom:12px;font-size:13px;}
  .wd.past{background:var(--amber-light);border-color:#E6D3B0;}
  .wd input{padding:6px 8px;border:1px solid var(--border);border-radius:7px;font-size:14px;background:white;}
  .cl-row{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);}
  .cl-row:last-child{border-bottom:none;}
  .cl-box{width:28px;height:28px;border-radius:8px;border:2px solid #C9C4B6;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:white;flex-shrink:0;margin-top:1px;}
  .cl-box.on{background:var(--green);border-color:var(--green);}
  .cl-box.part{background:var(--amber);border-color:var(--amber);font-size:11px;font-weight:700;}
  .cl-main{flex:1;min-width:0;}
  .cl-text{font-size:15px;font-weight:500;line-height:1.3;}
  .cl-row.done .cl-text{color:var(--ink-light);}
  .cl-sub{font-size:12px;color:var(--ink-faint);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .cl-side{display:flex;gap:5px;align-items:center;flex-shrink:0;}
  .cl-count{font-size:13px;font-weight:600;color:var(--ink-light);white-space:nowrap;}
  .icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:white;cursor:pointer;font-size:14px;color:var(--ink-light);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .add-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .add-row .form-input,.add-row .form-select{flex:1;min-width:120px;}
  .insp-table{width:100%;border-collapse:collapse;font-size:13px;}
  .insp-table td{padding:8px 4px;border-bottom:1px solid var(--border);vertical-align:top;}
  .insp-table tr:last-child td{border-bottom:none;}
  .insp-type{font-weight:600;white-space:nowrap;}
  .insp-pass{color:var(--green);font-weight:600;}
  .insp-fail{color:var(--red);font-weight:700;}
  .insp-hist{font-size:12px;color:var(--ink-light);margin-top:3px;}
  .insp-hist .f{color:var(--red);}
  .fail-box{background:var(--red-light);border:1px solid #E3BDB4;color:var(--red);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;}
  .phase-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--cream);margin-bottom:6px;}
  .phase-row.done{background:var(--green-light);border-color:#C6D4BC;}
  .phase-row.inprogress{background:var(--amber-light);border-color:#E6D3B0;}
  .phase-name{font-size:14px;font-weight:500;flex:1;}
  .phase-date{font-size:11px;color:var(--ink-light);}
  .phase-status-select{padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:white;font-size:13px;}
  .log-entry{padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:white;display:flex;gap:9px;align-items:flex-start;margin-bottom:6px;}
  .log-avatar{width:30px;height:30px;border-radius:50%;background:var(--copper-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--copper-text);flex-shrink:0;}
  .log-info{flex:1;min-width:0;}
  .log-worker{font-size:14px;font-weight:600;}
  .log-detail{font-size:12px;color:var(--ink-light);margin-top:1px;}
  .log-notes{font-size:13px;color:var(--ink-light);margin-top:2px;}
  .log-date{font-size:11px;color:var(--ink-faint);white-space:nowrap;text-align:right;}
  .fixture-row{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--cream);font-size:13px;margin-bottom:5px;}
  .fixture-name{flex:1;}
  .plan-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);}
  .full-card-title + .plan-row{border-top:none;}
  .plan-icon{width:36px;height:36px;border-radius:9px;background:var(--gold-pale);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .plan-info{flex:1;min-width:0;}
  .plan-name{font-size:14px;font-weight:600;color:var(--ink);}
  .plan-label{font-weight:500;color:var(--ink-light);font-size:12px;background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:1px 6px;margin-left:4px;}
  .plan-sub{font-size:12px;color:var(--ink-faint);font-weight:400;}
  .plan-cur{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--copper-light);color:var(--copper-text);white-space:nowrap;}
  .plan-old{margin:0 0 8px 46px;background:var(--cream);border-radius:9px;padding:7px 10px;}
  .plan-old summary{font-size:12px;color:var(--ink-light);cursor:pointer;font-weight:600;}
  .plan-old-row{display:flex;align-items:center;gap:8px;padding:7px 0 2px;font-size:13px;}
  .plan-old-name{flex:1;min-width:0;}
  .plan-old-tag{font-size:11px;padding:1px 7px;border-radius:6px;background:white;border:1px solid var(--border);color:var(--ink-faint);}
  .plan-missing{padding-top:9px;border-top:1px solid var(--border);}
  .plan-note{background:var(--gold-pale);color:var(--gold-text);border-radius:9px;padding:9px 11px;font-size:13px;}
  .spinner{width:18px;height:18px;border:2px solid var(--copper-light);border-top-color:var(--copper);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .doc-slots-grid{display:flex;gap:8px;flex-wrap:wrap;}
  .doc-tile{flex:1;min-width:130px;border:1px solid var(--border);border-radius:10px;background:white;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .doc-tile.has-link{border-color:var(--copper-light);background:var(--copper-pale);}
  .doc-tile-icon{font-size:22px;line-height:1;}
  .doc-tile-label{font-size:12px;font-weight:600;color:var(--ink-light);}
  .doc-tile-input{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;font-size:12px;}
  .doc-tile-btns{display:flex;gap:4px;width:100%;}
  .doc-tile-btns .btn{flex:1;}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;}
  .photo-thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--cream);border:1px solid var(--border);cursor:pointer;position:relative;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(46,46,46,.6);color:white;font-size:9px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);}
  .up-row .ok{color:var(--green);font-weight:600;}.up-row .bad{color:var(--red);font-weight:600;}
  .viewer img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:8px;}
  .section-title{font-family:'DM Serif Display',serif;font-size:20px;margin:18px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .list-card{background:white;border:1px solid var(--border);border-radius:12px;padding:6px 12px;margin-bottom:12px;}
  .list-head{font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;color:var(--ink-light);padding:10px 0 4px;display:flex;justify-content:space-between;align-items:center;}
  .list-head.red{color:var(--red);}
  .house-link{color:var(--copper-text);font-weight:600;cursor:pointer;text-decoration:underline;}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
  .person-card{background:white;border:1px solid var(--border);border-radius:12px;padding:12px;}
  .person-name{font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .user-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .user-row:last-child{border-bottom:none;}
  .rep-table{width:100%;border-collapse:collapse;font-size:13px;background:white;}
  .rep-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-light);padding:7px 8px;border-bottom:2px solid var(--border);}
  .rep-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  .rep-group{font-weight:700;background:var(--copper-pale);}
  .login{position:fixed;inset:0;background:var(--cream);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .login.open{display:flex;}
  .login-card{background:var(--warm-white);border:1px solid var(--border);border-radius:18px;padding:24px 20px;width:100%;max-width:400px;text-align:center;}
  .login-logo{display:block;width:220px;max-width:80%;height:auto;margin:0 auto 6px;}.login-avatar{width:56px;height:56px;background:var(--copper-light);color:var(--copper-text);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;margin:0 auto 10px;}.login-rule{width:36px;height:2px;background:var(--gold);margin:12px auto;}
  .login-title{font-family:'DM Serif Display',serif;font-size:24px;}
  .login-names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .login-names button{padding:16px 8px;font-size:16px;font-weight:600;border-radius:12px;border:1px solid var(--border);background:white;cursor:pointer;color:var(--ink);}
  .pin-input{font-size:28px;letter-spacing:10px;text-align:center;padding:12px;border:2px solid var(--border);border-radius:12px;width:100%;margin-top:12px;outline:none;}
  .pin-input:focus{border-color:var(--copper);}
  .login-err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:white;padding:11px 16px;border-radius:10px;font-size:14px;z-index:600;opacity:0;transition:all .25s;max-width:92vw;text-align:center;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.bad{background:var(--red);}
  .grp-gap td{padding:0!important;height:14px;background:var(--cream);border-bottom:none!important;cursor:default;}
  .master-table tbody tr.grp-gap:hover td{background:var(--cream);}
  .grp-head td{background:var(--copper-pale)!important;font-weight:700;font-size:12px;color:var(--copper-text);padding:7px 10px!important;cursor:default;}
  .grp-block{margin-bottom:18px;}
  .grp-name{font-weight:700;font-size:13px;color:var(--copper-text);margin:0 2px 6px;}
  .insp-cards{display:none;}
  .icard{background:white;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;box-shadow:var(--shadow);}
  .icard.has-fail{border-color:var(--red);}
  .icard-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .icard-addr{font-weight:600;font-size:15px;line-height:1.25;}
  .icard-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px;text-align:center;}
  .icard-dots .lab{font-size:9px;text-transform:uppercase;color:var(--ink-light);letter-spacing:.2px;margin-bottom:3px;display:block;white-space:nowrap;}
  .insp-dot.ready{background:var(--amber-light);color:var(--gold-text);border:1px solid #E6D3B0;}
  .insp-dot.set{background:var(--blue-light);color:var(--blue);border:1px solid #C5D4E2;}
  .q-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .q-row:last-child{border-bottom:none;}
  .q-main{flex:1;min-width:170px;}
  .q-title{font-size:15px;font-weight:600;line-height:1.3;}
  .q-sub{font-size:12px;color:var(--ink-light);margin-top:2px;}
  .q-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .q-btns .btn{padding:10px 13px;}
  .q-day{font-size:12px;font-weight:700;color:var(--ink-light);padding:12px 2px 2px;text-transform:uppercase;letter-spacing:.5px;}
  .q-day.late{color:var(--red);}
  .contact-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .contact-row:last-child{border-bottom:none;}
  .contact-main{flex:1;min-width:160px;}
  .contact-name{font-size:16px;font-weight:600;line-height:1.3;}
  .contact-phone{font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums;}
  .contact-btns{display:flex;gap:6px;align-items:center;}
  .contact-btns .btn{padding:11px 14px;font-size:14px;}
  .btn-ready{background:var(--ink);color:white;font-weight:600;}
  .order-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--border);}
  .order-row:last-child{border-bottom:none;}
  @media(max-width:700px){#page-inspections .master-table-wrap{display:none;}.insp-cards{display:block;}.action-row .btn-ready{flex-basis:100%;padding:14px 10px;font-size:15px;}}
  @media(max-width:600px){.form-row{flex-direction:column;gap:0;}.jobs-grid{grid-template-columns:1fr;}.header-sub{display:none;}.hide-sm{display:none;}}
  @media print{.header,.tab-bar,.banner,.no-print,.toast{display:none!important;}body{background:white;}.main{padding:0;}.page{display:none!important;}#page-reports{display:block!important;}}
</style>
</head>

// ---------- small helpers
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return isoOf(new Date());}
function addDays(iso,n){const p=iso.split('-');return isoOf(new Date(+p[0],+p[1]-1,+p[2]+n));}
function wd(){return workDate&&workDate<=todayStr()?workDate:todayStr();}
function fmtDate(d){if(!d)return '';const dt=new Date(d+'T00:00:00');if(isNaN(dt))return d;return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtShort(d){if(!d)return '';const dt=new Date(d+'T00:00:00');if(isNaN(dt))return d;return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDay(d){if(!d)return '';const dt=new Date(d+'T00:00:00');if(isNaN(dt))return d;return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function tsDate(ts){if(!ts)return '';const d=new Date(ts);return isNaN(d)?'':isoOf(d);}
function genId(p){let s='';while(s.length<12)s+=Math.random().toString(36).slice(2);return p+s.slice(0,12);}
function getInitials(n){return String(n||'?').split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2);}
function isOwner(){return !!S.me&&S.me.role==='owner';}
function getJob(id){return S.jobs.find(j=>j.id===id);}
function userName(id){const u=(S.users.length?S.users:S.team).find(x=>x.id===id);return u?u.name:'';}
function activeUsers(){return (S.users||[]).filter(u=>u.active);}
function safeUrl(u){return /^https?:\/\//i.test(String(u||''))?String(u):'';}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function fmtTime(t){const m=/^(\d\d):(\d\d)$/.exec(String(t||''));if(!m)return '';const h=+m[1];return ((h+11)%12+1)+':'+m[2]+(h<12?' AM':' PM');}
function whenText(date,time){return [date?fmtShort(date):'',fmtTime(time)].filter(Boolean).join(', ');}
function byTime(a,b){const x=a.time||'99:99',y=b.time||'99:99';return x<y?-1:x>y?1:0;}
let toastTimer=null;
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className='toast show'+(bad?' bad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='toast';},bad?4500:2200);}
function setSyncStatus(s,m){const el=$('sync-status');el.textContent=m;el.className='sync-status '+s;if(s==='saved')setTimeout(()=>{if(el.textContent===m){el.className='sync-status';el.textContent='';}},2200);}

// ---------- talking to the Google Sheet
async function api(action,payload,timeoutMs){
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),timeoutMs||45000);
  let r;
  try{r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(Object.assign({action,token:S.token,v:API_V},payload||{})),signal:ctl.signal,redirect:'follow'});}
  catch(e){const err=new Error('No connection');err.code='offline';throw err;}
  finally{clearTimeout(timer);}
  let d;
  try{d=await r.json();}catch(e){const err=new Error('The tracker did not answer correctly. Try again.');err.code='server';throw err;}
  if(!d||!d.ok){const err=new Error((d&&d.message)||'Something went wrong.');err.code=(d&&d.error)||'server';throw err;}
  return d;
}
function applyResponse(d){
  if(d.jobs)S.jobs=d.jobs;
  if(d.contacts)S.contacts=d.contacts;
  if(d.job){const i=S.jobs.findIndex(j=>j.id===d.job.id);if(i>=0)S.jobs[i]=d.job;else S.jobs.unshift(d.job);}
  if(d.task){const i=S.tasks.findIndex(t=>t.id===d.task.id);if(i>=0)S.tasks[i]=d.task;else S.tasks.push(d.task);}
  if(d.users)S.users=d.users;
  if(d.settings)S.settings=d.settings;
  if(d.setupOpen!=null)S.setupOpen=d.setupOpen;
}
function saveCache(){lsSet('pjt2_cache',JSON.stringify({jobs:S.jobs,tasks:S.tasks,contacts:S.contacts,settings:S.settings,users:S.users,team:S.team,photoCounts:S.photoCounts}));}
function saveQueue(){lsSet('pjt2_queue',JSON.stringify(queue));updateQueueBanner();}
function updateQueueBanner(){
  const b=$('queue-banner');
  if(!queue.length||flushing){b.style.display='none';return;}
  b.style.display='block';
  b.innerHTML=queue.length+' change'+(queue.length===1?'':'s')+' saved on this device, waiting for signal to send. <button class="btn btn-sm btn-outline" onclick="flush()">Send now</button>';
}
// Every change goes through here: show it right away when we can, then send it. Nothing is lost if the signal drops.
const waiters={};
function mutate(action,payload,local){
  payload=Object.assign({opId:genId('o_')},payload);
  if(local){try{local();}catch(e){}}
  queue.push({action,payload,u:S.me?S.me.id:''});saveQueue();
  if(local)render();
  const done=new Promise(res=>{waiters[payload.opId]=res;});
  flush();
  return done;
}
function settle(op,ok){const w=waiters[op.payload.opId];if(w){delete waiters[op.payload.opId];w(ok);}}
async function flush(){
  if(flushing||!queue.length)return;
  flushing=true;updateQueueBanner();setSyncStatus('saving','Saving...');
  let needSync=false,failed=false;
  while(queue.length){
    const op=queue[0];
    try{
      const d=await api(op.action,op.payload);
      queue.shift();saveQueue();
      if(d.dup)needSync=true;else applyResponse(d);
      settle(op,true);
    }catch(e){
      if(e.code==='offline'||e.code==='busy'){failed=true;break;}
      if(e.code==='auth'){flushing=false;authLost(e.message);return;}
      queue.shift();saveQueue();needSync=true;toast(e.message,true);settle(op,false);
    }
  }
  flushing=false;updateQueueBanner();
  if(failed){setSyncStatus('error','Not sent yet');render();return;}
  setSyncStatus('saved','✓ Saved');saveCache();
  if(needSync)await sync();else render();
}
async function sync(manual){
  if(!S.token)return;
  if(queue.length){await flush();if(queue.length){if(manual)toast('No signal. Your changes are saved on this phone and will send when you are back online.',true);return;}}
  setSyncStatus('saving','Loading...');
  try{
    const d=await api('load');
    S.me=d.me;S.jobs=d.jobs;S.tasks=d.tasks;S.contacts=d.contacts||[];S.settings=d.settings;S.users=d.users||[];S.team=d.team||[];S.photoCounts=d.photoCounts||{};S.setupOpen=!!d.setupOpen;
    lsSet('pjt2_me',JSON.stringify(S.me));saveCache();lastSync=Date.now();
    setSyncStatus('saved','✓ Up to date');
    safeRender();
  }catch(e){
    if(e.code==='auth'){authLost(e.message);return;}
    setSyncStatus('error',e.code==='offline'?'Offline':'Sync failed');
    if(manual)toast(e.code==='offline'?'No signal. Showing the last saved copy.':e.message,true);
  }
}
function authLost(msg){S.token='';lsDel('pjt2_token');showLogin(msg||'Please enter your PIN again.');}

async function doLogin(id){
  const pin=$('pin').value.trim();if(!pin)return;
  $('login-go').disabled=true;$('login-err').textContent='';
  try{const d=await api('login',{userId:id,pin});loggedIn(d);}
  catch(e){$('login-err').textContent=e.code==='offline'?'No connection. Try again.':e.message;$('login-go').disabled=false;$('pin').value='';$('pin').focus();}
}
async function doSetup(id){
  const pin=$('pin').value.trim(),pin2=$('pin2').value.trim(),code=$('setup-code').value.trim();
  if(!/^\d{4,8}$/.test(pin)){$('login-err').textContent='A PIN is 4 to 8 numbers.';return;}
  if(pin!==pin2){$('login-err').textContent='The two PINs do not match.';return;}
  $('login-go').disabled=true;$('login-err').textContent='';
  try{const d=await api('setup',{userId:id,pin,code});loggedIn(d);}
  catch(e){$('login-err').textContent=e.code==='offline'?'No connection. Try again.':e.message;$('login-go').disabled=false;}
}

// ---------- modal
function openModal(o){
  $('modal-title').textContent=o.title||'';$('modal-body').innerHTML=o.body||'';
  modalFns=(o.buttons||[]).map(b=>b.fn);modalOnClose=o.onClose||null;
  $('modal-footer').innerHTML=(o.buttons||[]).map((b,i)=>'<button class="btn '+(b.cls||'btn-outline')+'" onclick="modalFns['+i+']()">'+esc(b.label)+'</button>').join('');
  $('modal').classList.add('open');
  const f=$('modal-body').querySelector('[data-focus]');if(f)f.focus();
}
function closeModal(){$('modal').classList.remove('open');const c=modalOnClose;modalOnClose=null;if(c)c();if(renderPending)safeRender();}
function modalOpen(){return $('modal').classList.contains('open');}
function isTyping(){const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox';}
function safeRender(){if(modalOpen()||isTyping()){renderPending=true;return;}render();}
document.addEventListener('focusout',()=>{if(renderPending)setTimeout(()=>{if(renderPending)safeRender();},150);});

// ---------- tabs and top level render
function tabsFor(){
  const mine=myListItems().filter(x=>!x.done&&x.date&&x.date<=todayStr()).length;
  const fails=S.jobs.filter(j=>j.status!=='complete'&&openFails(j).length).length;
  const toSet=isOwner()?allReqs().filter(x=>!x.r.setDate).length:0;
  const failBadge=(toSet?'<span class="tab-count">'+toSet+'</span>':'')+(fails?'<span class="tab-count red">'+fails+'</span>':'');
  const myBadge=mine?'<span class="tab-count">'+mine+'</span>':'';
  if(isOwner())return [['inspections','📋 Inspections'+failBadge],['jobs','🏠 Houses'],['team','👷 Team & To Dos'],['phonebook','📞 Phone Book'],['reports','📊 Reports'],['completed','✅ Completed'],['mylist','📝 My List'+myBadge]];
  return [['mylist','📝 My List'+myBadge],['jobs','🏠 Houses'],['inspections','📋 Inspections'+failBadge],['phonebook','📞 Phone Book'],['completed','✅ Completed']];
}
function switchTab(t){tab=t;workDate='';render();window.scrollTo(0,0);}
function render(){
  renderPending=false;
  if(!S.me)return;
  const ae=document.activeElement;const fid=ae&&ae.id&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&!$('modal').contains(ae)&&!$('login').contains(ae)?ae.id:'';
  const fval=fid?ae.value:'';
  renderPages();
  if(fid){const el=$(fid);if(el&&el!==ae){el.value=fval;el.focus();}}
}
function renderPages(){
  const tabs=tabsFor();
  if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  $('tab-bar').innerHTML=tabs.map(t=>'<button class="tab-btn'+(t[0]===tab?' active':'')+'" onclick="switchTab(\''+t[0]+'\')">'+t[1]+'</button>').join('');
  $('me-btn').textContent=S.me.name;
  $('header-sub').textContent='Plumbing Job Tracker';
  document.querySelectorAll('.owner-only').forEach(el=>{el.style.display=isOwner()?'':'none';});
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+tab));
  if(tab==='mylist')renderMyList();
  if(tab==='inspections')renderInspections();
  if(tab==='jobs')renderJobs();
  if(tab==='completed')renderCompleted();
  if(tab==='phonebook')renderPhoneBook();
  document.querySelectorAll('.grp-toggle').forEach(el=>{el.textContent=showGroups?'Hide builder names':'Show builder names';});
  if(tab==='team')renderTeam();
  if(tab==='reports')renderReports();
  if(currentJobId)renderDetail();
  updateQueueBanner();
}

// ---------- shared pieces
function itemDone(it){return (it.entries||[]).reduce((s,e)=>s+(Number(e.n)||0),0);}
function checklistProgress(job){const c=job.checklist||[];let total=0,done=0;c.forEach(it=>{const q=Number(it.qty)||1;total+=q;done+=Math.min(q,itemDone(it));});return {total,done};}
function latestInsp(job,key){let best=null,bi=-1;(job.inspLog||[]).forEach((e,i)=>{if(e.key!==key)return;if(!best||e.date>best.date||(e.date===best.date&&i>bi)){best=e;bi=i;}});return best;}
function openFails(job){return INSP_KEYS.map((k,i)=>{const l=latestInsp(job,k);return l&&l.result==='fail'?{key:k,label:INSP_LABELS[i],entry:l}:null;}).filter(Boolean);}
function cityKey(c){return String(c||'').toUpperCase().replace(/\s+/g,' ').trim();}
// Houses are kept in Brenda's order: builder, then neighborhood. The names only show when asked for.
let showGroups=lsGet('pjt2_groups')==='1';
function toggleGroups(){showGroups=!showGroups;lsSet('pjt2_groups',showGroups?'1':'');render();}
function gKey(b,n){return cityKey(b)+'|'+cityKey(n);}
function jobGroup(j){return gKey(j.builder,j.subdivision);}
function groupLabel(j){return [j.builder,j.subdivision].filter(Boolean).join(' · ')||'No builder yet';}
function listSort(list){
  const m={};(S.settings.groupOrder||[]).forEach((k,i)=>{m[k]=i;});
  const rk=j=>{const k=jobGroup(j);return k==='|'?2e6:(k in m?m[k]:1e6);};
  return list.slice().sort((a,b)=>{
    const ra=rk(a),rb=rk(b);if(ra!==rb)return ra-rb;
    const ka=jobGroup(a),kb=jobGroup(b);if(ka!==kb)return ka<kb?-1:1;
    const oa=Number(a.ord)||0,ob=Number(b.ord)||0;if(oa&&ob)return oa-ob;if(oa!==ob)return oa?-1:1;
    return houseSort(a,b);});
}
function grouped(list){const out=[];listSort(list).forEach(j=>{const k=jobGroup(j);const g=out[out.length-1];if(g&&g.key===k)g.jobs.push(j);else out.push({key:k,label:groupLabel(j),jobs:[j]});});return out;}
function knownBuilders(){const s={};S.jobs.forEach(j=>{if(j.builder)s[j.builder.trim()]=1;});(S.contacts||[]).forEach(c=>{if(c.builder)s[c.builder.trim()]=1;});return Object.keys(s).sort();}
function knownHoods(){const s={};S.jobs.forEach(j=>{if(j.subdivision)s[j.subdivision.trim()]=1;});(S.contacts||[]).forEach(c=>{if(c.neighborhood)s[c.neighborhood.trim()]=1;});return Object.keys(s).sort();}
function dataList(id,vals){return '<datalist id="'+id+'">'+vals.map(v=>'<option value="'+esc(v)+'">').join('')+'</datalist>';}
// Ready for inspection: asked for, then set for a day, then waiting on the result.
function reqFor(job,key){return (job.inspReqs||[]).find(r=>r.key===key);}
function allReqs(){const out=[];S.jobs.forEach(j=>{if(j.status==='complete')return;(j.inspReqs||[]).forEach(r=>out.push({job:j,r}));});return out;}
function inspLabel(k){return INSP_LABELS[INSP_KEYS.indexOf(k)]||k;}
// The builder contact for a house: the one picked for it, or the Phone Book contacts for its builder and neighborhood.
function contactsFor(job){
  const all=S.contacts||[];
  if(job.contactId){const c=all.find(x=>x.id===job.contactId);if(c)return [c];}
  const b=cityKey(job.builder),n=cityKey(job.subdivision);if(!b&&!n)return [];
  let m=all.filter(c=>cityKey(c.builder)===b&&cityKey(c.neighborhood)===n);
  if(!m.length&&b&&n)m=all.filter(c=>cityKey(c.builder)===b&&!cityKey(c.neighborhood));
  return m;
}
function telOf(p){const d=String(p||'').replace(/[^\d+]/g,'');return d.replace(/\+/g,'').length>=7?d:'';}
function contactRow(c,edit){

  return '<div class="contact-row"><div class="contact-main"><div class="contact-name">'+esc(c.name)+'</div><div class="q-sub">'+esc([c.builder,c.neighborhood].filter(Boolean).join(' · '))+(c.notes?'<div>'+esc(c.notes)+'</div>':'')+'</div>'+

    '<div class="contact-btns">'+(tel?'<a class="btn btn-primary" href="tel:'+esc(tel)+'">📞 Call</a><a class="btn btn-outline" href="sms:'+esc(tel)+'">💬 Text</a>':'')+(edit&&isOwner()?'<button class="icon-btn" title="Edit contact" aria-label="Edit contact" onclick="openContactModal(\''+c.id+'\')">✎</button>':'')+'</div></div>';
}
function inspUrlFor(job){return safeUrl(job.inspUrl)||safeUrl((S.settings.inspLinks||{})[cityKey(job.city)])||'';}
function cityFull(c){return String(c||'').replace(/^HOU\b/i,'Houston').replace(/^MONT\b/i,'Montgomery');}
function mapsUrl(job){
  const apple=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  const addr=[String(job.address||'').replace(/\([^)]*\)/g,'').replace(/\s+P\d+$/i,'').trim(),cityFull(job.city),job.zip].filter(Boolean).join(', ');
  if(job.pin)return apple?'https://maps.apple.com/?ll='+encodeURIComponent(job.pin)+'&q='+encodeURIComponent(job.address):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(job.pin);
  return apple?'https://maps.apple.com/?q='+encodeURIComponent(addr):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);
}

function entryWho(e){

function checklistRow(job,it,showHouse){
  const q=Number(it.qty)||1,d=Math.min(q,itemDone(it)),done=d>=q;
  const mine=(it.entries||[]).filter(e=>isOwner()||e.by===S.me.id);
  const grouped=[];(it.entries||[]).forEach(e=>{const g=q>1&&grouped.find(x=>x.by===e.by&&x.byName===e.byName&&x.date===e.date&&tsDate(x.ts)===tsDate(e.ts));if(g)g.n+=Number(e.n)||0;else grouped.push(Object.assign({},e,{n:Number(e.n)||0}));});
  const who=grouped.map(e=>(q>1?esc(String(e.n))+' by ':'')+entryWho(e)).join(', ');
  let box;
  if(q===1)box='<div class="cl-box'+(done?' on':'')+'" role="checkbox" aria-checked="'+done+'" onclick="'+(done?'uncheckItem':'checkItem')+'(\''+job.id+'\',\''+it.id+'\')">'+(done?'✓':'')+'</div>';
  else box='<div class="cl-box'+(done?' on':d?' part':'')+'">'+(done?'✓':d||'')+'</div>';
  let side='';
  if(q>1){
    side='<span class="cl-count">'+d+' of '+q+'</span>'+(mine.length&&d?'<button class="icon-btn" title="Undo one" onclick="uncheckItem(\''+job.id+'\',\''+it.id+'\')">−</button>':'')+(done?'':'<button class="btn btn-sm btn-green" onclick="checkItem(\''+job.id+'\',\''+it.id+'\')">+1</button>');
  }
  if(isOwner()&&!showHouse)side+='<button class="icon-btn" title="Edit" onclick="openItemModal(\''+job.id+'\',\''+it.id+'\')">✎</button>';
  let chips='';
  if(it.assignee){const n=it.assignee===S.me.id?'You':userName(it.assignee);chips+='<span class="chip chip-blue">'+esc(n||'Assigned')+(it.due?' · due '+esc(whenText(it.due,it.time)):it.time?' · '+esc(fmtTime(it.time)):'')+'</span>';}
  else if(it.due||it.time)chips+='<span class="chip chip-grey">'+(it.due?'due ':'')+esc(whenText(it.due,it.time))+'</span>';
  if(it.due&&!done&&it.due<todayStr())chips+='<span class="chip chip-red">past due</span>';
  const house=showHouse?'<span class="house-link" onclick="openDetail(\''+job.id+'\')">'+esc(job.address)+'</span>':'';
  return '<div class="cl-row'+(done?' done':'')+'">'+box+'<div class="cl-main"><div class="cl-text">'+esc(it.text)+'</div><div class="cl-sub">'+house+chips+(who?'<span>'+who+'</span>':'')+'</div></div><div class="cl-side">'+side+'</div></div>';
}
function checkItem(jobId,itemId){
  const job=getJob(jobId);const it=job&&job.checklist.find(x=>x.id===itemId);if(!it)return;
  const entryId=genId('e_'),date=wd();
  mutate('jobOp',{jobId,op:'check',args:{itemId,entryId,n:1,date}},()=>{it.entries.push({id:entryId,by:S.me.id,byName:S.me.name,date,n:1});});
}
function uncheckItem(jobId,itemId){
  const job=getJob(jobId);const it=job&&job.checklist.find(x=>x.id===itemId);if(!it)return;
  const mine=it.entries.filter(e=>isOwner()||e.by===S.me.id);const e=mine[mine.length-1];
  if(!e){toast('Only the person who checked this off, or an owner, can undo it.',true);return;}
  if(!confirm('Undo "'+it.text+'"'+(e.byName?' ('+e.byName+', '+fmtShort(e.date)+')':'')+'?'))return;
  mutate('jobOp',{jobId,op:'uncheck',args:{itemId,entryId:e.id}},()=>{it.entries=it.entries.filter(x=>x!==e);});
}

// ---------- My List
function myListItems(){
  if(!S.me)return [];
  const out=[];
  S.tasks.filter(t=>t.assigneeId===S.me.id).forEach(t=>out.push({type:'task',id:t.id,date:t.date,time:t.time,done:t.done,doneDate:t.doneDate,text:t.text,job:t.jobId?getJob(t.jobId):null,task:t}));
  S.jobs.forEach(j=>(j.tickets||[]).forEach(t=>{if(t.assignee===S.me.id&&(j.status!=='complete'||!t.done))out.push({type:'ticket',id:t.id,date:t.date||'',time:t.time,done:!!t.done,doneDate:t.doneDate,text:t.text,job:j,ticket:t});}));
  S.jobs.filter(j=>j.status!=='complete').forEach(j=>(j.checklist||[]).forEach(it=>{if(it.assignee===S.me.id){const done=itemDone(it)>=(Number(it.qty)||1);const last=(it.entries||[]).slice(-1)[0];out.push({type:'item',id:it.id,date:it.due||'',time:it.time,done,doneDate:last?last.date:'',text:it.text,job:j,item:it});}}));
  return out.sort(byTime);
}
function taskRow(t,ownerView){
  const job=t.jobId?getJob(t.jobId):null;
  const late=!t.done&&t.date<todayStr();
  return '<div class="cl-row'+(t.done?' done':'')+'"><div class="cl-box'+(t.done?' on':'')+'" role="checkbox" aria-checked="'+!!t.done+'" onclick="toggleTask(\''+t.id+'\')">'+(t.done?'✓':'')+'</div><div class="cl-main"><div class="cl-text">'+esc(t.text)+'</div><div class="cl-sub">'+
    (job?'<span class="house-link" onclick="openDetail(\''+job.id+'\')">'+esc(job.address)+'</span>':'')+
    (t.time?'<span class="chip chip-grey">🕘 '+esc(fmtTime(t.time))+'</span>':'')+
    (late?'<span class="chip chip-red">from '+esc(fmtShort(t.date))+'</span>':'')+
    (t.done?'<span>Done '+esc(fmtShort(t.doneDate))+(ownerView&&t.doneTs&&tsDate(t.doneTs)!==t.doneDate?' (entered '+esc(fmtShort(tsDate(t.doneTs)))+')':'')+'</span>':'')+
    '</div></div>'+(ownerView?'<div class="cl-side"><button class="icon-btn" title="Edit" onclick="openTaskModal(\''+t.id+'\')">✎</button></div>':'')+'</div>';
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const done=!t.done,date=wd();
  mutate('taskToggle',{id,done,date},()=>{t.done=done;t.doneDate=done?date:'';t.doneByName=done?S.me.name:'';});
}
function renderMyList(){
  const today=todayStr(),week=addDays(today,7);
  const items=myListItems();
  const row=x=>x.type==='task'?taskRow(x.task,false):x.type==='ticket'?ticketRow(x.job,x.ticket,true):checklistRow(x.job,x.item,true);
  const sec=(title,list,cls)=>list.length?'<div class="list-card"><div class="list-head '+(cls||'')+'">'+title+'<span>'+list.filter(x=>!x.done).length+' open</span></div>'+list.map(row).join('')+'</div>':'';
  const overdue=items.filter(x=>!x.done&&x.date&&x.date<today);
  const todays=items.filter(x=>x.date===today||(x.done&&x.doneDate===today&&x.date!==today&&x.date));
  const soon=items.filter(x=>x.date>today&&x.date<=week).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:byTime(a,b));
  const undated=items.filter(x=>!x.date&&!x.done);
  let h='<div class="section-title">'+esc(S.me.name)+'\'s list</div>'+workDateBar();
  h+=sec('Past due',overdue,'red')+sec('Today · '+esc(fmtDay(today)),todays)+sec('Assigned to you',undated);
  if(soon.length){
    h+='<div class="list-card"><div class="list-head">Coming up this week</div>';
    let last='';soon.forEach(x=>{if(x.date!==last){last=x.date;h+='<div class="muted" style="padding:8px 0 0;font-weight:600">'+esc(fmtDay(x.date))+'</div>';}h+=row(x);});
    h+='</div>';
  }
  if(!overdue.length&&!todays.length&&!soon.length&&!undated.length)h+='<div class="empty-state">Nothing on your list right now.<br>Open a house to check off work you finished.</div>';
  h+='<div class="muted" style="text-align:center;margin-top:6px">Only you and the owners can see this list.</div>';
  $('mylist-body').innerHTML=h;
}

// ---------- Inspections table
function setSeg(id,idx){[...$(id).children].forEach((b,i)=>b.classList.toggle('on',i===idx));}
function setInspFilter(f){inspFilter=f;setSeg('insp-filter',f==='all'?0:1);renderInspections();}
function copyPermit(jobId){const job=getJob(jobId);if(!job||!job.permit)return;copyText(job.permit).then(ok=>{toast(ok?'Project number '+job.permit+' copied. Paste it on the city page.':'Could not copy. Press and hold the number to copy it.',!ok);});}
function renderQueue(){
  const own=isOwner(),today=todayStr(),tomorrow=addDays(today,1);
  const reqs=allReqs();
  const toSet=reqs.filter(x=>!x.r.setDate).sort((a,b)=>a.r.date<b.r.date?-1:a.r.date>b.r.date?1:0);
  const pend=reqs.filter(x=>x.r.setDate).sort((a,b)=>a.r.setDate<b.r.setDate?-1:a.r.setDate>b.r.setDate?1:houseSort(a.job,b.job));
  const addr=x=>'<span class="house-link" onclick="openDetail(\''+x.job.id+'\')">'+esc(x.job.address)+'</span>';
  let h='';
  if(own||toSet.length){
    h+='<div class="list-card"><div class="list-head">🔔 Ready for inspection, to be set<span>'+toSet.length+'</span></div>';
    h+=toSet.map(x=>'<div class="q-row"><div class="q-main"><div class="q-title">'+addr(x)+' · '+esc(inspLabel(x.r.key))+'</div><div class="q-sub">Asked by '+esc(x.r.byName||'')+', '+esc(fmtDay(x.r.date))+(x.r.note?' · '+esc(x.r.note):'')+'</div></div><div class="q-btns">'+
      (own?'<button class="btn btn-primary" onclick="openSetModal(\''+x.job.id+'\',\''+x.r.id+'\',\''+x.r.key+'\')">Set date</button><button class="icon-btn" title="Take off the list" aria-label="Take off the list" onclick="delReq(\''+x.job.id+'\',\''+x.r.id+'\')">✕</button>'
        :x.r.by===S.me.id?'<button class="btn btn-outline" onclick="delReq(\''+x.job.id+'\',\''+x.r.id+'\')">Cancel</button>':'<span class="chip chip-amber">waiting to be set</span>')+'</div></div>').join('')||'<div class="muted" style="padding:10px 2px">Nothing waiting to be set.</div>';
    h+='</div>';
  }
  if(own||pend.length){
    h+='<div class="list-card"><div class="list-head">⏳ Set, waiting on results<span>'+pend.length+'</span></div>';
    let last=null;
    pend.forEach(x=>{
      const d=x.r.setDate;
      if(d!==last){last=d;h+='<div class="q-day'+(d<today?' late':'')+'">'+(d<today?'Result due · set for '+esc(fmtDay(d)):d===today?'Today · '+esc(fmtDay(d)):d===tomorrow?'Tomorrow · '+esc(fmtDay(d)):esc(fmtDay(d)))+'</div>';}
      const iu=inspUrlFor(x.job);
      h+='<div class="q-row"><div class="q-main"><div class="q-title">'+addr(x)+' · '+esc(inspLabel(x.r.key))+'</div><div class="q-sub">'+(x.job.permit?'#'+esc(x.job.permit)+' · ':'')+'Asked by '+esc(x.r.byName||'')+(x.r.note?' · '+esc(x.r.note):'')+'</div></div><div class="q-btns">'+
        (own?(iu?'<a class="btn btn-outline" href="'+esc(iu)+'" target="_blank" rel="noopener" onclick="copyPermit(\''+x.job.id+'\')">City ↗</a>':'')+
          '<button class="btn btn-green" onclick="openInspModal(\''+x.r.key+'\',\'pass\',\''+x.job.id+'\')">Passed</button><button class="btn btn-red" onclick="openInspModal(\''+x.r.key+'\',\'fail\',\''+x.job.id+'\')">Failed</button><button class="icon-btn" title="Change the date" aria-label="Change the date" onclick="openSetModal(\''+x.job.id+'\',\''+x.r.id+'\',\''+x.r.key+'\')">✎</button>'
          :'<span class="chip chip-blue">set for '+esc(fmtShort(d))+'</span>')+'</div></div>';
    });
    if(!pend.length)h+='<div class="muted" style="padding:10px 2px">No inspections waiting on results.</div>';
    h+='</div>';
  }
  $('insp-queue').innerHTML=h;
}
function inspCellParts(h,k){
  const l=latestInsp(h,k),r=reqFor(h,k);
  if(r&&r.setDate)return ['<div class="insp-dot set">…</div>','set '+fmtShort(r.setDate)];
  if(r)return ['<div class="insp-dot ready">!</div>','ready'];
  if(l&&l.result==='fail')return ['<div class="insp-dot fail">✕</div>',fmtShort(l.date)];
  if(l)return ['<div class="insp-dot done">✓</div>',fmtShort(l.date)];
  return ['<div class="insp-dot empty">·</div>',''];
}
const INSP_SHORT=['Grnd','Sewer','Gas','Rough','Pan','T Gas','Final'];
function openSetModal(jobId,reqId,key){
  const job=getJob(jobId);if(!job)return;
  const r=(job.inspReqs||[]).find(x=>x.id===reqId)||reqFor(job,key);
  const def=r&&r.setDate?r.setDate:addDays(todayStr(),1);
  const buttons=[{label:'Cancel',fn:closeModal}];
  if(r&&r.setDate)buttons.push({label:'Not set yet',cls:'btn-outline',fn:()=>{closeModal();mutate('jobOp',{jobId,op:'inspSet',args:{reqId:r.id,key,clear:true}},()=>{r.setDate='';});}});
  buttons.push({label:'Save',cls:'btn-primary',fn:()=>{
    const date=$('set-date').value;if(!date){toast('Pick the day.',true);return;}
    const id=r?r.id:genId('q_');
    closeModal();mutate('jobOp',{jobId,op:'inspSet',args:{reqId:id,key,date}},()=>{if(r)r.setDate=date;else (job.inspReqs=job.inspReqs||[]).push({id,key,by:S.me.id,byName:S.me.name,date:todayStr(),note:'',setDate:date});});
  }});
  openModal({title:inspLabel(key)+' inspection: set the date',body:
    '<p style="font-size:14px;margin-bottom:10px"><b>'+esc(job.address)+'</b></p>'+
    '<div class="form-group"><label class="form-label">Day the inspection is set for</label><input class="form-input" id="set-date" type="date" value="'+def+'"></div>'+
    '<div class="form-hint">It moves to "Set, waiting on results" until you mark it Passed or Failed.</div>',buttons});
}
function delReq(jobId,reqId){
  const job=getJob(jobId);if(!job)return;
  if(!confirm('Take this off the inspection list?'))return;
  mutate('jobOp',{jobId,op:'inspReqDel',args:{reqId}},()=>{job.inspReqs=(job.inspReqs||[]).filter(x=>x.id!==reqId);});
}
function openReadyModal(){
  const job=getJob(currentJobId);if(!job)return;
  const free=INSP_KEYS.filter(k=>!reqFor(job,k));
  if(!free.length){toast('Every inspection on this house is already on the list.',true);return;}
  const state=k=>{const l=latestInsp(job,k);return !l?'':l.result==='fail'?' (failed '+fmtShort(l.date)+')':' (passed '+fmtShort(l.date)+')';};
  const def=free.find(k=>{const l=latestInsp(job,k);return l&&l.result==='fail';})||free.find(k=>!latestInsp(job,k))||free[0];
  openModal({title:'Ready for inspection',body:
    '<p style="font-size:14px;margin-bottom:10px"><b>'+esc(job.address)+'</b></p>'+
    '<div class="form-group"><label class="form-label">Which inspection</label><select class="form-select" id="rq-key">'+free.map(k=>'<option value="'+k+'"'+(k===def?' selected':'')+'>'+esc(inspLabel(k)+state(k))+'</option>').join('')+'</select></div>'+
    '<div class="form-group"><label class="form-label">Note for the office (optional)</label><textarea class="form-textarea" id="rq-note" placeholder="Anything they should know before calling it in"></textarea></div>'+
    '<div class="form-hint">Brenda and Teodoro will see this house on their list of inspections to set.</div>',
    buttons:[{label:'Cancel',fn:closeModal},{label:'Send',cls:'btn-primary',fn:()=>{
      const key=$('rq-key').value,note=$('rq-note').value.trim(),id=genId('q_');
      closeModal();
      mutate('jobOp',{jobId:job.id,op:'inspReq',args:{reqId:id,key,note}},()=>{(job.inspReqs=job.inspReqs||[]).push({id,key,by:S.me.id,byName:S.me.name,date:todayStr(),note,setDate:''});}).then(ok=>{if(ok)toast(inspLabel(key)+' inspection sent to the office.');});
    }}]});
}
function renderInspections(){
  renderQueue();
  const all=listSort(S.jobs.filter(j=>j.status!=='complete'));
  let f=all;
  if(inspFilter==='failed')f=f.filter(j=>openFails(j).length);
  if(inspSearch)f=f.filter(h=>matchJob(h,inspSearch));
  $('insp-count').textContent=f.length+' of '+all.length+' houses';
  const groups=grouped(f);
  const tr=h=>{
    const dots=INSP_KEYS.map(k=>{const c=inspCellParts(h,k);return '<td class="insp-cell">'+c[0]+(c[1]?'<span class="insp-date">'+esc(c[1])+'</span>':'')+'</td>';}).join('');
    const p=checklistProgress(h);const pct=p.total?Math.round(p.done/p.total*100):0;
    return '<tr onclick="openDetail(\''+h.id+'\')"><td><div class="addr-cell">'+esc(h.address)+'</div><div class="addr-city">'+esc([h.city,h.zip].filter(Boolean).join(' '))+'</div></td><td class="permit-cell">'+esc(h.permit||'')+'</td>'+dots+'<td style="min-width:70px"><div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div><div class="muted" style="font-size:10px;margin-top:2px">'+p.done+' of '+p.total+'</div></td></tr>';
  };
  $('insp-tbody').innerHTML=groups.map((g,i)=>(i?'<tr class="grp-gap"><td colspan="10"></td></tr>':'')+(showGroups?'<tr class="grp-head"><td colspan="10">'+esc(g.label)+'</td></tr>':'')+g.jobs.map(tr).join('')).join('')||'<tr><td colspan="10" class="empty-state">No houses found</td></tr>';
  // phones get one compact card per house instead of the wide table
  const card=h=>'<div class="icard'+(openFails(h).length?' has-fail':'')+'" onclick="openDetail(\''+h.id+'\')"><div class="icard-top"><div class="icard-addr">'+esc(h.address)+'</div><div class="permit-cell">'+esc(h.permit||'')+'</div></div><div class="addr-city">'+esc([cityFull(h.city),h.zip].filter(Boolean).join(' '))+'</div><div class="icard-dots">'+
    INSP_KEYS.map((k,i)=>{const c=inspCellParts(h,k);return '<div><span class="lab">'+INSP_SHORT[i]+'</span>'+c[0]+'<span class="insp-date">'+esc(c[1]||'')+'</span></div>';}).join('')+'</div></div>';
  $('insp-cards').innerHTML=groups.map(g=>'<div class="grp-block">'+(showGroups?'<div class="grp-name">'+esc(g.label)+'</div>':'')+g.jobs.map(card).join('')+'</div>').join('')||'<div class="empty-state">No houses found</div>';
}

// ---------- House cards
function setJobFilter(f){jobFilter=f;setSeg('job-filter',['all','active','pending','warranty'].indexOf(f));renderJobs();}
function lastWorkDate(job){let d='';(job.log||[]).forEach(l=>{if(l.date>d)d=l.date;});(job.checklist||[]).forEach(it=>(it.entries||[]).forEach(e=>{if(!e.prior&&e.date>d)d=e.date;}));return d;}
function jobCard(job){
  const p=checklistProgress(job);const pct=p.total?Math.round(p.done/p.total*100):0;
  const fails=openFails(job);const passed=INSP_KEYS.filter(k=>job.inspections&&job.inspections[k]).length;
  const last=lastWorkDate(job);const pc=S.photoCounts[job.id]||0;
  return '<div class="job-card'+(fails.length?' has-fail':'')+'" onclick="openDetail(\''+job.id+'\')"><div class="job-card-header"><div><div class="job-address">'+esc(job.address)+'</div><div class="job-lot">'+esc([cityFull(job.city),job.zip].filter(Boolean).join(' ')||'')+(job.permit?' · #'+esc(job.permit):'')+'</div></div><span class="status-badge status-'+esc(job.status)+'">'+esc(STATUS_LABELS[job.status]||job.status)+'</span></div>'+
    '<div class="job-card-body">'+fails.map(f=>'<span class="chip chip-red" style="margin:0 4px 6px 0">✕ '+esc(f.label)+' failed</span>').join('')+
    (job.inspReqs||[]).map(r=>r.setDate?'<span class="chip chip-blue" style="margin:0 4px 6px 0">'+esc(inspLabel(r.key))+' set '+esc(fmtShort(r.setDate))+'</span>':'<span class="chip chip-amber" style="margin:0 4px 6px 0">🔔 '+esc(inspLabel(r.key))+' ready</span>').join('')+
    (openTickets(job).length?'<span class="chip chip-grey" style="margin:0 4px 6px 0">🛠 '+openTickets(job).length+' warranty open</span>':'')+
    '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div><div class="muted" style="margin-top:4px">Checklist '+p.done+' of '+p.total+' · Inspections '+passed+' of 7</div></div>'+
    '<div class="job-card-footer"><span>'+(last?'Last work '+esc(fmtShort(last)):'No work logged yet')+'</span><span>'+(pc?'📷 '+pc:'')+'</span></div></div>';
}
function houseSort(a,b){
  const k=j=>{const m=/^(\d+)\s+(.*)$/.exec(String(j.address||'').trim());return m?[m[2].toUpperCase(),+m[1]]:[String(j.address||'').toUpperCase(),0];};
  const x=k(a),y=k(b);return x[0]<y[0]?-1:x[0]>y[0]?1:x[1]-y[1];
}
function matchJob(j,q){const t=q.toLowerCase();return (j.address||'').toLowerCase().includes(t)||(j.builder||'').toLowerCase().includes(t)||(j.subdivision||'').toLowerCase().includes(t)||(j.city||'').toLowerCase().includes(t)||(j.permit||'').toLowerCase().includes(t);}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}
function renderHello(){
  const open=S.jobs.filter(j=>j.status!=='complete');

    '<div class="stat-row"><button class="stat" onclick="setJobFilter(\'all\');window.scrollTo(0,document.getElementById(\'jobs-grid\').offsetTop-130)"><div class="stat-label">Active houses</div><div class="stat-num">'+open.length+'</div></button>'+
    '<button class="stat" onclick="switchTab(\'inspections\')"><div class="stat-label">'+mid[0]+' for inspection</div><div class="stat-num">'+mid[1]+'</div></button>'+

}
function renderJobs(){
  renderHello();

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).then(()=>true,()=>fallbackCopy(text));
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(e){return false;}}

// ---------- Plans (PDFs uploaded by the owners, everyone can open them)
const PLAN_TYPES=[['foundation','Foundation','🏗️'],['floor','Floor plan','📐'],['fixtures','Plumbing fixtures','🚿'],['utility','Site utility','🗺️'],['other','Other','📎']];
const PLAN_MAX=30*1024*1024;
const planUploads=[];
function planType(t){return PLAN_TYPES.find(x=>x[0]===t)||PLAN_TYPES[4];}
function planKey(p){return p.type==='other'?'other|'+String(p.name||'').trim().toUpperCase():p.type;}
function planNewest(a,b){return a.date<b.date?1:a.date>b.date?-1:(String(a.ts||a.id)<String(b.ts||b.id)?1:-1);}
function planGroups(job){
  const by={};(job.plans||[]).forEach(p=>{(by[planKey(p)]=by[planKey(p)]||[]).push(p);});
  const out=[];
  PLAN_TYPES.forEach(t=>{Object.keys(by).filter(k=>(by[k][0].type===t[0])).sort().forEach(k=>{
    const list=by[k].slice().sort(planNewest);const cur=list.find(p=>p.current)||list[0];
    out.push({type:t,cur,older:list.filter(p=>p!==cur)});});});
  return out;
}
function fmtSize(n){n=Number(n)||0;return n>=1048576?(n/1048576).toFixed(1)+'\u00a0MB':n?Math.max(1,Math.round(n/1024))+'\u00a0KB':'';}
function planOpenBtn(p,label){
  return p.url&&safeUrl(p.url)?'<a class="btn btn-primary btn-sm" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+label+'</a>':'<button class="btn btn-primary btn-sm" onclick="openPlan(\''+esc(p.id)+'\')">'+label+'</button>';
}
function planWho(p){return 'Uploaded '+fmtShort(p.date)+(p.byName?' by '+p.byName:'');}
function plansCard(job,own){
  const groups=planGroups(job);
  const have={};groups.forEach(g=>{have[g.type[0]]=1;});
  const missing=PLAN_TYPES.slice(0,4).filter(t=>!have[t[0]]).map(t=>t[1]);
  const ups=planUploads.filter(u=>u.jobId===job.id);
  let h='<div class="full-card"><div class="full-card-title">📄 Plans'+(own?'<button class="btn btn-primary btn-sm" onclick="openPlanUpload()">⬆ Upload plans</button>':'')+'</div>';
  h+=ups.map(u=>'<div class="plan-row"><div class="plan-icon">⏳</div><div class="plan-info"><div class="plan-name">'+esc(planType(u.type)[1])+(u.name?': '+esc(u.name):'')+'</div><div class="plan-sub">'+(u.error?'<span style="color:var(--red)">'+esc(u.error)+'</span>':'Uploading '+esc(u.file)+'. Keep this screen open.')+'</div></div>'+(u.error?'<button class="icon-btn" title="Dismiss" onclick="dismissPlanUpload(\''+u.id+'\')">✕</button>':'<span class="spinner"></span>')+'</div>').join('');
  h+=groups.map(g=>{
    const c=g.cur;
    let r='<div class="plan-row"><div class="plan-icon">'+g.type[2]+'</div><div class="plan-info"><div class="plan-name">'+esc(g.type[0]==='other'?(c.name||'Other'):g.type[1])+(g.type[0]!=='other'&&c.name?' <span class="plan-label">'+esc(c.name)+'</span>':'')+'</div><div class="plan-sub">'+esc(planWho(c))+(c.size?' · '+fmtSize(c.size):'')+'</div></div>'+
      (g.older.length?'<span class="plan-cur">Current</span>':'')+planOpenBtn(c,'Open')+(own?'<button class="icon-btn" title="Delete this file" onclick="delPlan(\''+esc(c.id)+'\')">✕</button>':'')+'</div>';
    if(g.older.length)r+='<details class="plan-old"><summary>Older versions ('+g.older.length+')</summary>'+g.older.map(o=>'<div class="plan-old-row"><span class="plan-old-tag">Old</span><span class="plan-old-name">'+esc(o.name||g.type[1])+'<span class="plan-sub"> · '+esc(planWho(o))+'</span></span>'+planOpenBtn(o,'Open')+(own?'<button class="icon-btn" title="Delete this file" onclick="delPlan(\''+esc(o.id)+'\')">✕</button>':'')+'</div>').join('')+'</details>';
    return r;
  }).join('');
  if(!groups.length&&!ups.length)h+='<div class="muted" style="padding:4px 0">'+(own?'No plans uploaded yet. Tap Upload plans to add the PDFs for this house.':'No plans uploaded for this house yet.')+'</div>';
  else if(missing.length)h+='<div class="muted plan-missing">Not uploaded: '+esc(missing.join(', '))+'</div>';
  return h+'</div>';
}

function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result||'');res(s.slice(s.indexOf(',')+1));};r.onerror=()=>rej(r.error);r.readAsDataURL(file);});}
async function startPlanUpload(){
  const job=getJob(currentJobId);if(!job)return;
  const type=$('pl-type').value,name=$('pl-name').value.trim(),date=$('pl-date').value||todayStr(),f=$('pl-file').files[0];
  if(!f){toast('Pick the PDF file.',true);return;}
  if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){toast('That file is not a PDF.',true);return;}
  if(f.size>PLAN_MAX){toast('That PDF is too large. Files can be up to 30 MB.',true);return;}
  if(type==='other'&&!name){toast('Give this file a name, like Electrical.',true);return;}
  closeModal();
  const u={id:genId('pl_'),jobId:job.id,type,name,date,file:f.name,error:''};
  planUploads.push(u);if(currentJobId===job.id)renderDetail();
  try{
    const data=await readB64(f);
    const d=await api('planUpload',{plan:{jobId:job.id,type,name,date},data},600000);
    planUploads.splice(planUploads.indexOf(u),1);
    const args={id:u.id,type,name,date,fileId:d.fileId,shared:!!d.shared};
    mutate('jobOp',{jobId:job.id,op:'planAdd',args},()=>{
      const k=planKey({type,name});(job.plans=job.plans||[]).forEach(p=>{if(planKey(p)===k)p.current=false;});
      job.plans.push({id:u.id,type,name,date,by:S.me.id,byName:S.me.name,size:f.size,current:true,shared:!!d.shared,url:d.shared?'https://drive.google.com/file/d/'+d.fileId+'/view':''});
    });
    toast(planType(type)[1]+' uploaded');
  }catch(e){
    u.error=e.code==='offline'?'No connection. The upload did not finish. Try again when you have signal.':e.message;
    toast(u.error,true);
  }
  if(currentJobId===job.id)renderDetail();

function ticketRow(job,t,showHouse){
  const own=isOwner(),today=todayStr();

  let chips=showHouse?'<span class="chip chip-grey">🛠 warranty</span>':'';

  if(t.assignee)chips+='<span class="chip chip-blue">'+esc((t.assignee===S.me.id?'You':userName(t.assignee))||'Assigned')+(when?' · '+esc(when):'')+'</span>';
  else if(when)chips+='<span class="chip chip-grey">'+esc(when)+'</span>';
  if(!t.done&&t.date&&t.date<today)chips+='<span class="chip chip-red">past due</span>';

// ---------- photos
async function loadPhotos(jobId,force){
  if(photoCache[jobId]&&!force)return;
  try{const d=await api('photos',{jobId});photoCache[jobId]=d.photos;S.photoCounts[jobId]=d.photos.length;if(currentJobId===jobId)renderPhotos();}
  catch(e){if(currentJobId===jobId&&!photoCache[jobId]){const a=$('photo-area');if(a)a.innerHTML='<div class="muted">Photos could not load'+(e.code==='offline'?' (no signal)':'')+'. <a href="#" onclick="loadPhotos(\''+jobId+'\',true);return false">Try again</a></div>';}}
}
function renderPhotos(){
  const a=$('photo-area');if(!a||!currentJobId)return;
  const list=photoCache[currentJobId];
  if(!list){a.innerHTML='<div class="muted">Loading photos...</div>';return;}
  if(!list.length){a.innerHTML='<div class="muted">No photos yet. Everyone on the team can see photos added here.</div>';return;}
  a.innerHTML='<div class="photo-grid">'+list.slice().reverse().map(p=>'<div class="photo-thumb" onclick="viewPhoto(\''+p.id+'\')">'+(p.thumb?'<img alt="" src="data:image/jpeg;base64,'+p.thumb+'">':'')+'<span>'+esc(p.userName)+' · '+esc(fmtShort(p.date))+'</span></div>').join('')+'</div>';
}
function pickPhotos(){const i=$('photo-input');i.value='';i.click();}
function loadImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);res(img);};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};img.src=url;});}
function shrink(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q).split(',')[1];}
function photoFilesPicked(input){
  const jobId=currentJobId;if(!jobId)return;
  const phaseEl=$('photo-phase');const phase=phaseEl?phaseEl.value:'';const date=wd();
  [...input.files].slice(0,12).forEach(file=>{const u={id:genId('p_'),jobId,file,name:file.name,phase,date,state:'waiting'};uploads.push(u);});
  if(input.files.length>12)toast('Only the first 12 photos were added. Upload the rest in a second batch.',true);
  renderUploads();runUploads();
}
let uploading=false;
async function runUploads(){
  if(uploading)return;uploading=true;
  for(;;){
    const u=uploads.find(x=>x.state==='waiting');if(!u)break;
    u.state='sending';renderUploads();
    try{
      if(!u.data){const img=await loadImage(u.file);u.data=shrink(img,1600,0.72);u.thumb=shrink(img,200,0.55);}
      const d=await api('photoAdd',{opId:u.id,photo:{id:u.id,jobId:u.jobId,date:u.date,phase:u.phase},data:u.data,thumb:u.thumb},120000);
      u.state='done';u.data=null;u.file=null;
      if(d.photo){(photoCache[u.jobId]=photoCache[u.jobId]||[]).push(d.photo);S.photoCounts[u.jobId]=(S.photoCounts[u.jobId]||0)+1;}
      else loadPhotos(u.jobId,true);
    }catch(e){u.state='failed';u.error=e.code==='offline'?'No signal':e.message;if(e.code==='auth'){uploading=false;authLost(e.message);return;}}
    renderUploads();if(currentJobId===u.jobId)renderPhotos();
  }
  uploading=false;
}
