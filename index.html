<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crown Elite Job Tracker</title>
<meta name="theme-color" content="#1C1A17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#F7F4EF;--warm-white:#FDFCFA;--ink:#1C1A17;--ink-light:#5C5750;--ink-faint:#8F8A83;
    --copper:#B5651D;--copper-light:#E8D5C4;--copper-pale:#F5EDE4;
    --blue:#2D5A8E;--blue-light:#EBF1F9;--green:#2D6E4E;--green-light:#E8F4EE;
    --amber:#C17B2A;--amber-light:#FBF0E0;--red:#9B3A2A;--red-light:#FAEAE7;
    --border:#E5E0D8;--shadow:0 2px 8px rgba(28,26,23,0.08);--shadow-lg:0 8px 32px rgba(28,26,23,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}
  button,input,select,textarea{font-family:inherit;}
  a{color:var(--copper);}
  .header{background:var(--ink);padding:0 14px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;min-height:58px;position:sticky;top:0;z-index:100;gap:8px;}
  .header-brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .header-icon{width:32px;height:32px;background:var(--copper);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .header-title{font-family:'DM Serif Display',serif;color:var(--warm-white);font-size:18px;line-height:1.1;}
  .header-sub{color:#B9B3AA;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .header-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
  .sync-status{padding:4px 9px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;}
  .sync-status.saving{background:rgba(255,255,255,0.1);color:#ccc;}
  .sync-status.saved{background:rgba(45,110,78,0.3);color:#7DCEA0;}
  .sync-status.error{background:rgba(155,58,42,0.35);color:#F4A79C;}
  .btn{padding:9px 13px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;white-space:nowrap;}
  .btn-primary{background:var(--copper);color:white;}.btn-primary:hover{background:#9B5518;}
  .btn-ghost{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.15);}
  .btn-outline{background:white;color:var(--ink);border:1px solid var(--border);}.btn-outline:hover{background:var(--cream);}
  .btn-green{background:var(--green);color:white;}.btn-red{background:var(--red);color:white;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:default;}
  .tab-bar{background:white;border-bottom:1px solid var(--border);display:flex;padding:0 8px;overflow-x:auto;position:sticky;top:58px;z-index:90;}
  .tab-btn{padding:13px 12px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
  .tab-btn.active{color:var(--copper);border-bottom-color:var(--copper);}
  .tab-count{background:var(--copper);color:white;border-radius:10px;font-size:10px;padding:1px 6px;margin-left:4px;}
  .tab-count.red{background:var(--red);}
  .banner{padding:8px 14px;font-size:13px;text-align:center;background:var(--amber-light);color:#7A4A10;border-bottom:1px solid #E8C88A;}
  .banner button{margin-left:8px;}
  .page{display:none;}.page.active{display:block;}
  .container{max-width:1200px;margin:0 auto;padding:0 14px;}
  .main{padding:16px 0 80px;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .search-input{flex:1;min-width:160px;max-width:320px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:white;font-size:14px;outline:none;}
  .search-input:focus{border-color:var(--copper);}
  .seg{display:flex;gap:3px;background:white;border:1px solid var(--border);border-radius:8px;padding:3px;}
  .seg button{padding:6px 10px;font-size:12px;border:none;border-radius:6px;background:none;color:var(--ink-light);cursor:pointer;font-weight:500;}
  .seg button.on{background:var(--ink);color:white;}
  .muted{color:var(--ink-faint);font-size:12px;}
  .master-table-wrap{background:white;border-radius:12px;border:1px solid var(--border);overflow:auto;box-shadow:var(--shadow);}
  .master-table{width:100%;border-collapse:collapse;font-size:12px;}
  .master-table th{background:var(--ink);color:rgba(255,255,255,0.85);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;padding:10px;text-align:left;white-space:nowrap;}
  .master-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .master-table tr:last-child td{border-bottom:none;}
  .master-table tbody tr{cursor:pointer;}
  .master-table tbody tr:hover td{background:var(--copper-pale);}
  .addr-cell{font-weight:600;font-size:13px;white-space:nowrap;}
  .addr-city{font-size:11px;font-weight:400;color:var(--ink-faint);margin-top:1px;}
  .permit-cell{font-size:12px;color:var(--ink-light);font-family:ui-monospace,Menlo,monospace;}
  .insp-cell{text-align:center;min-width:60px;}
  .insp-dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .insp-dot.done{background:var(--green-light);color:var(--green);}
  .insp-dot.fail{background:var(--red);color:white;}
  .insp-dot.empty{background:var(--cream);color:var(--ink-faint);border:1px solid var(--border);font-size:9px;}
  .insp-date{font-size:9px;color:var(--ink-faint);margin-top:1px;display:block;white-space:nowrap;}
  .prog-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .prog-fill{height:100%;border-radius:3px;background:var(--copper);}
  .jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;}
  .job-card{background:white;border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;}
  .job-card.has-fail{border-color:var(--red);}
  .job-card-header{padding:13px 14px 9px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .job-address{font-weight:600;font-size:15px;line-height:1.3;}
  .job-lot{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .status-badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .status-active{background:var(--blue-light);color:var(--blue);}
  .status-complete{background:var(--green-light);color:var(--green);}
  .status-pending{background:var(--amber-light);color:var(--amber);}
  .status-warranty{background:var(--copper-pale);color:var(--copper);}
  .job-card-body{padding:0 14px 11px;}
  .job-card-footer{padding:8px 14px;background:var(--cream);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-faint);gap:8px;}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .chip-red{background:var(--red-light);color:var(--red);}
  .chip-blue{background:var(--blue-light);color:var(--blue);}
  .chip-amber{background:var(--amber-light);color:#8A5412;}
  .chip-grey{background:var(--cream);color:var(--ink-light);border:1px solid var(--border);}
  .empty-state{text-align:center;padding:44px 20px;color:var(--ink-faint);font-size:14px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(28,26,23,0.5);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-backdrop.open{opacity:1;pointer-events:all;}
  .modal{background:white;border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);margin:auto;}
  .modal-header{padding:15px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .modal-title{font-family:'DM Serif Display',serif;font-size:19px;}
  .modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;font-size:14px;color:var(--ink-light);flex-shrink:0;}
  .modal-body{padding:15px 18px;}
  .modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
  .form-row{display:flex;gap:10px;}
  .form-row .form-group{flex:1;min-width:0;}
  .form-group{margin-bottom:11px;}
  .form-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-light);margin-bottom:4px;}
  .form-input,.form-select,.form-textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:15px;color:var(--ink);background:white;outline:none;}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--copper);}
  .form-textarea{resize:vertical;min-height:70px;}
  .form-hint{font-size:12px;color:var(--ink-faint);margin-top:4px;}
  .detail-backdrop{position:fixed;inset:0;background:var(--cream);z-index:150;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;visibility:hidden;}
  .detail-backdrop.open{transform:translateX(0);visibility:visible;}
  .detail-header{background:white;border-bottom:1px solid var(--border);padding:11px 14px;padding-top:calc(11px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
  .back-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .detail-title-wrap{flex:1;min-width:0;}
  .detail-title{font-family:'DM Serif Display',serif;font-size:18px;line-height:1.2;color:var(--ink);text-decoration:none;display:inline-block;}
  .detail-title .pin{font-size:14px;margin-right:3px;}
  .detail-meta{font-size:12px;color:var(--ink-faint);margin-top:1px;}
  .detail-body{max-width:880px;margin:0 auto;padding:14px 14px 80px;}
  .action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .action-row .btn{flex:1;min-width:120px;padding:11px 10px;}
  .full-card{background:white;border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:12px;}
  .full-card-title{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-light);margin-bottom:10px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .project-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .project-num{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:600;letter-spacing:.5px;user-select:all;-webkit-user-select:all;padding:4px 10px;background:var(--cream);border:1px solid var(--border);border-radius:8px;}
  .wd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:white;margin-bottom:12px;font-size:13px;}
  .wd.past{background:var(--amber-light);border-color:#E8C88A;}
  .wd input{padding:6px 8px;border:1px solid var(--border);border-radius:7px;font-size:14px;background:white;}
  .cl-row{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);}
  .cl-row:last-child{border-bottom:none;}
  .cl-box{width:28px;height:28px;border-radius:8px;border:2px solid #C9C2B7;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:white;flex-shrink:0;margin-top:1px;}
  .cl-box.on{background:var(--green);border-color:var(--green);}
  .cl-box.part{background:var(--amber);border-color:var(--amber);font-size:11px;font-weight:700;}
  .cl-main{flex:1;min-width:0;}
  .cl-text{font-size:15px;font-weight:500;line-height:1.3;}
  .cl-row.done .cl-text{color:var(--ink-light);}
  .cl-sub{font-size:12px;color:var(--ink-faint);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .cl-side{display:flex;gap:5px;align-items:center;flex-shrink:0;}
  .cl-count{font-size:13px;font-weight:600;color:var(--ink-light);white-space:nowrap;}
  .icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:white;cursor:pointer;font-size:14px;color:var(--ink-light);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .add-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .add-row .form-input,.add-row .form-select{flex:1;min-width:120px;}
  .insp-table{width:100%;border-collapse:collapse;font-size:13px;}
  .insp-table td{padding:8px 4px;border-bottom:1px solid var(--border);vertical-align:top;}
  .insp-table tr:last-child td{border-bottom:none;}
  .insp-type{font-weight:600;white-space:nowrap;}
  .insp-pass{color:var(--green);font-weight:600;}
  .insp-fail{color:var(--red);font-weight:700;}
  .insp-hist{font-size:12px;color:var(--ink-light);margin-top:3px;}
  .insp-hist .f{color:var(--red);}
  .fail-box{background:var(--red-light);border:1px solid #E5B5AC;color:var(--red);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;}
  .phase-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--cream);margin-bottom:6px;}
  .phase-row.done{background:var(--green-light);border-color:#B8DEC9;}
  .phase-row.inprogress{background:var(--amber-light);border-color:#E8C88A;}
  .phase-name{font-size:14px;font-weight:500;flex:1;}
  .phase-date{font-size:11px;color:var(--ink-light);}
  .phase-status-select{padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:white;font-size:13px;}
  .log-entry{padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:white;display:flex;gap:9px;align-items:flex-start;margin-bottom:6px;}
  .log-avatar{width:30px;height:30px;border-radius:50%;background:var(--copper-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--copper);flex-shrink:0;}
  .log-info{flex:1;min-width:0;}
  .log-worker{font-size:14px;font-weight:600;}
  .log-detail{font-size:12px;color:var(--ink-light);margin-top:1px;}
  .log-notes{font-size:13px;color:var(--ink-light);margin-top:2px;}
  .log-date{font-size:11px;color:var(--ink-faint);white-space:nowrap;text-align:right;}
  .fixture-row{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--cream);font-size:13px;margin-bottom:5px;}
  .fixture-name{flex:1;}
  .doc-slots-grid{display:flex;gap:8px;flex-wrap:wrap;}
  .doc-tile{flex:1;min-width:130px;border:1px solid var(--border);border-radius:10px;background:white;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .doc-tile.has-link{border-color:var(--copper-light);background:var(--copper-pale);}
  .doc-tile-icon{font-size:22px;line-height:1;}
  .doc-tile-label{font-size:12px;font-weight:600;color:var(--ink-light);}
  .doc-tile-input{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;font-size:12px;}
  .doc-tile-btns{display:flex;gap:4px;width:100%;}
  .doc-tile-btns .btn{flex:1;}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;}
  .photo-thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--cream);border:1px solid var(--border);cursor:pointer;position:relative;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(28,26,23,.6);color:white;font-size:9px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border);}
  .up-row .ok{color:var(--green);font-weight:600;}.up-row .bad{color:var(--red);font-weight:600;}
  .viewer img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:8px;}
  .section-title{font-family:'DM Serif Display',serif;font-size:20px;margin:18px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .list-card{background:white;border:1px solid var(--border);border-radius:12px;padding:6px 12px;margin-bottom:12px;}
  .list-head{font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;color:var(--ink-light);padding:10px 0 4px;display:flex;justify-content:space-between;align-items:center;}
  .list-head.red{color:var(--red);}
  .house-link{color:var(--copper);font-weight:600;cursor:pointer;text-decoration:underline;}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
  .person-card{background:white;border:1px solid var(--border);border-radius:12px;padding:12px;}
  .person-name{font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .user-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .user-row:last-child{border-bottom:none;}
  .rep-table{width:100%;border-collapse:collapse;font-size:13px;background:white;}
  .rep-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-light);padding:7px 8px;border-bottom:2px solid var(--border);}
  .rep-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
  .rep-group{font-weight:700;background:var(--copper-pale);}
  .login{position:fixed;inset:0;background:var(--ink);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .login.open{display:flex;}
  .login-card{background:var(--warm-white);border-radius:18px;padding:24px 20px;width:100%;max-width:400px;text-align:center;}
  .login-logo{width:56px;height:56px;background:var(--copper);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 10px;}
  .login-title{font-family:'DM Serif Display',serif;font-size:24px;}
  .login-names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .login-names button{padding:16px 8px;font-size:16px;font-weight:600;border-radius:12px;border:1px solid var(--border);background:white;cursor:pointer;color:var(--ink);}
  .pin-input{font-size:28px;letter-spacing:10px;text-align:center;padding:12px;border:2px solid var(--border);border-radius:12px;width:100%;margin-top:12px;outline:none;}
  .pin-input:focus{border-color:var(--copper);}
  .login-err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:white;padding:11px 16px;border-radius:10px;font-size:14px;z-index:600;opacity:0;transition:all .25s;max-width:92vw;text-align:center;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.bad{background:var(--red);}
  @media(max-width:600px){.form-row{flex-direction:column;gap:0;}.jobs-grid{grid-template-columns:1fr;}.header-sub{display:none;}.hide-sm{display:none;}}
  @media print{.header,.tab-bar,.banner,.no-print,.toast{display:none!important;}body{background:white;}.main{padding:0;}.page{display:none!important;}#page-reports{display:block!important;}}
</style>
</head>
<body>

<div class="login" id="login"><div class="login-card" id="login-card"></div></div>

<div class="header">
  <div class="header-brand">
    <div class="header-icon">🔧</div>
    <div style="min-width:0"><div class="header-title">Crown Elite</div><div class="header-sub" id="header-sub">Plumbing Job Tracker</div></div>
  </div>
  <div class="header-actions">
    <span id="sync-status" class="sync-status"></span>
    <button class="btn btn-ghost btn-sm" onclick="sync(true)">⟳ Sync</button>
    <button class="btn btn-ghost btn-sm" id="me-btn" onclick="openMeMenu()"></button>
  </div>
</div>

<script>
const SCRIPT_URL = window.JT_TEST_URL || 'https://script.google.com/macros/s/AKfycbyb5KC0EeXO253R5tjU0-zyzdBl3A8TUXN0YMSLD-E7J5qxDZHAtVj-_URy6-yepAk/exec';
const API_V = 2;
const PHASES = ['Ground','Rough-in','Top out','Trim','Final inspection','Service/Warranty'];
const INSP_KEYS = ['ground','sewer','gas','roughIn','showPan','tempGas','final'];
const INSP_LABELS = ['Ground','Sewer','Gas','Rough In','Shower Pan','Temp Gas','Final'];
const DOC_KEYS = ['foundation','blueprint','materials','other'];
const DOC_LABELS = ['Foundation','Blueprints','Materials','Other'];
const DOC_ICONS = ['🏗️','📐','📦','📎'];
const STATUS_LABELS = {active:'Active',complete:'Complete',pending:'Pending',warranty:'Warranty'};

const S = {token:'',me:null,jobs:[],tasks:[],settings:{inspLinks:{},checklistTemplate:[]},users:[],team:[],photoCounts:{},setupOpen:false};
let queue=[],flushing=false,currentJobId=null,workDate='',tab='',lastSync=0,renderPending=false;
let jobFilter='all',jobSearch='',inspSearch='',inspFilter='all',completedSearch='',teamDate='';
const photoCache={},uploads=[];
let modalFns=[],modalOnClose=null;

// ---------- small helpers
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return isoOf(new Date());}
function addDays(iso,n){const p=iso.split('-');return isoOf(new Date(+p[0],+p[1]-1,+p[2]+n));}
function wd(){return workDate&&workDate<=todayStr()?workDate:todayStr();}
function fmtDate(d){if(!d)return '';const dt=new Date(d+'T00:00:00');if(isNaN(dt))return d;return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtShort(d){if(!d)return '';const dt=new Date(d+'T00:00:00');if(isNaN(dt))return d;return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDay(d){if(!d)return '';const dt=new Date(d+'T00:00:00');if(isNaN(dt))return d;return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function tsDate(ts){if(!ts)return '';const d=new Date(ts);return isNaN(d)?'':isoOf(d);}
function genId(p){let s='';while(s.length<12)s+=Math.random().toString(36).slice(2);return p+s.slice(0,12);}
function getInitials(n){return String(n||'?').split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2);}
function isOwner(){return !!S.me&&S.me.role==='owner';}
function getJob(id){return S.jobs.find(j=>j.id===id);}
function userName(id){const u=(S.users.length?S.users:S.team).find(x=>x.id===id);return u?u.name:'';}
function activeUsers(){return (S.users||[]).filter(u=>u.active);}
function safeUrl(u){return /^https?:\/\//i.test(String(u||''))?String(u):'';}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
let toastTimer=null;
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.className='toast show'+(bad?' bad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='toast';},bad?4500:2200);}
function setSyncStatus(s,m){const el=$('sync-status');el.textContent=m;el.className='sync-status '+s;if(s==='saved')setTimeout(()=>{if(el.textContent===m){el.className='sync-status';el.textContent='';}},2200);}

// ---------- talking to the Google Sheet
async function api(action,payload,timeoutMs){
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),timeoutMs||45000);
  let r;
  try{r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(Object.assign({action,token:S.token,v:API_V},payload||{})),signal:ctl.signal,redirect:'follow'});}
  catch(e){const err=new Error('No connection');err.code='offline';throw err;}
  finally{clearTimeout(timer);}
  let d;
  try{d=await r.json();}catch(e){const err=new Error('The tracker did not answer correctly. Try again.');err.code='server';throw err;}
  if(!d||!d.ok){const err=new Error((d&&d.message)||'Something went wrong.');err.code=(d&&d.error)||'server';throw err;}
  return d;
}
function applyResponse(d){
  if(d.job){const i=S.jobs.findIndex(j=>j.id===d.job.id);if(i>=0)S.jobs[i]=d.job;else S.jobs.unshift(d.job);}
  if(d.task){const i=S.tasks.findIndex(t=>t.id===d.task.id);if(i>=0)S.tasks[i]=d.task;else S.tasks.push(d.task);}
  if(d.users)S.users=d.users;
  if(d.settings)S.settings=d.settings;
  if(d.setupOpen!=null)S.setupOpen=d.setupOpen;
}
function saveCache(){lsSet('pjt2_cache',JSON.stringify({jobs:S.jobs,tasks:S.tasks,settings:S.settings,users:S.users,team:S.team,photoCounts:S.photoCounts}));}
function saveQueue(){lsSet('pjt2_queue',JSON.stringify(queue));updateQueueBanner();}
function updateQueueBanner(){
  const b=$('queue-banner');
  if(!queue.length||flushing){b.style.display='none';return;}
  b.style.display='block';
  b.innerHTML=queue.length+' change'+(queue.length===1?'':'s')+' saved on this device, waiting for signal to send. <button class="btn btn-sm btn-outline" onclick="flush()">Send now</button>';
}
// Every change goes through here: show it right away when we can, then send it. Nothing is lost if the signal drops.
const waiters={};
function mutate(action,payload,local){
  payload=Object.assign({opId:genId('o_')},payload);
  if(local){try{local();}catch(e){}}
  queue.push({action,payload,u:S.me?S.me.id:''});saveQueue();
  if(local)render();
  const done=new Promise(res=>{waiters[payload.opId]=res;});
  flush();
  return done;
}
function settle(op,ok){const w=waiters[op.payload.opId];if(w){delete waiters[op.payload.opId];w(ok);}}
async function flush(){
  if(flushing||!queue.length)return;
  flushing=true;updateQueueBanner();setSyncStatus('saving','Saving...');
  let needSync=false,failed=false;
  while(queue.length){
    const op=queue[0];
    try{
      const d=await api(op.action,op.payload);
      queue.shift();saveQueue();
      if(d.dup)needSync=true;else applyResponse(d);
      settle(op,true);
    }catch(e){
      if(e.code==='offline'||e.code==='busy'){failed=true;break;}
      if(e.code==='auth'){flushing=false;authLost(e.message);return;}
      queue.shift();saveQueue();needSync=true;toast(e.message,true);settle(op,false);
    }
  }
  flushing=false;updateQueueBanner();
  if(failed){setSyncStatus('error','Not sent yet');render();return;}
  setSyncStatus('saved','✓ Saved');saveCache();
  if(needSync)await sync();else render();
}
async function sync(manual){
  if(!S.token)return;
  if(queue.length){await flush();if(queue.length){if(manual)toast('No signal. Your changes are saved on this phone and will send when you are back online.',true);return;}}
  setSyncStatus('saving','Loading...');
  try{
    const d=await api('load');
    S.me=d.me;S.jobs=d.jobs;S.tasks=d.tasks;S.settings=d.settings;S.users=d.users||[];S.team=d.team||[];S.photoCounts=d.photoCounts||{};S.setupOpen=!!d.setupOpen;
    lsSet('pjt2_me',JSON.stringify(S.me));saveCache();lastSync=Date.now();
    setSyncStatus('saved','✓ Up to date');
    safeRender();
  }catch(e){
    if(e.code==='auth'){authLost(e.message);return;}
    setSyncStatus('error',e.code==='offline'?'Offline':'Sync failed');
    if(manual)toast(e.code==='offline'?'No signal. Showing the last saved copy.':e.message,true);
  }
}
function authLost(msg){S.token='';lsDel('pjt2_token');showLogin(msg||'Please enter your PIN again.');}

// ---------- login
let loginUsers=[],loginSetupOpen=false;
async function showLogin(msg){
  $('login').classList.add('open');
  $('login-card').innerHTML='<div class="login-logo">🔧</div><div class="login-title">Crown Elite</div><div class="muted" style="margin-top:4px">Job Tracker</div><div class="login-err">'+esc(msg||'')+'</div><div class="muted">Loading...</div>';
  try{
    const d=await api('users');loginUsers=d.users;loginSetupOpen=!!d.setupOpen;renderLoginNames(msg);
  }catch(e){
    const m=e.code==='offline'?'No connection. Check your signal and try again.':e.code==='update'||e.code==='server'?'The tracker needs its Google script updated before this new version can log in. (Brenda: paste the new Code.gs and deploy a new version.)':e.message;
    $('login-card').innerHTML='<div class="login-logo">🔧</div><div class="login-title">Crown Elite</div><div class="login-err">'+esc(m)+'</div><button class="btn btn-primary" style="margin-top:10px" onclick="showLogin()">Try again</button>';
  }
}
function renderLoginNames(msg){
  $('login-card').innerHTML='<div class="login-logo">🔧</div><div class="login-title">Crown Elite</div><div class="muted" style="margin-top:4px">Job Tracker. Who is this?</div><div class="login-err">'+esc(msg||'')+'</div><div class="login-names">'+
    loginUsers.map(u=>'<button onclick="pickLoginUser(\''+esc(u.id)+'\')">'+esc(u.name)+'</button>').join('')+'</div>';
}
function pickLoginUser(id){
  const u=loginUsers.find(x=>x.id===id);if(!u)return;
  const head='<div class="login-logo">'+esc(getInitials(u.name))+'</div><div class="login-title">'+esc(u.name)+'</div>';
  const back='<button class="btn btn-outline" style="margin-top:14px" onclick="renderLoginNames()">← Not '+esc(u.name)+'</button>';
  if(u.hasPin){
    $('login-card').innerHTML=head+'<div class="muted" style="margin-top:4px">Enter your PIN. This phone will remember you.</div><input class="pin-input" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" onkeydown="if(event.key===\'Enter\')doLogin(\''+esc(u.id)+'\')"><div class="login-err" id="login-err"></div><button class="btn btn-primary" style="width:100%;padding:13px;font-size:15px" id="login-go" onclick="doLogin(\''+esc(u.id)+'\')">Log in</button>'+back;
    $('pin').focus();
  }else if(u.role==='owner'&&loginSetupOpen){
    $('login-card').innerHTML=head+'<div class="muted" style="margin-top:4px">First time setup. Enter the setup code, then choose your own PIN (4 to 8 numbers).</div><input class="form-input" id="setup-code" placeholder="Setup code" autocapitalize="characters" autocomplete="off" style="margin-top:12px;text-align:center;font-size:18px;letter-spacing:2px"><input class="pin-input" id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off"><input class="pin-input" id="pin2" type="password" inputmode="numeric" maxlength="8" placeholder="Again" autocomplete="off"><div class="login-err" id="login-err"></div><button class="btn btn-primary" style="width:100%;padding:13px;font-size:15px" id="login-go" onclick="doSetup(\''+esc(u.id)+'\')">Save my PIN</button>'+back;
  }else{
    $('login-card').innerHTML=head+'<div class="login-err">No PIN has been set for you yet. Ask Brenda or Teodoro to set one.</div>'+back;
  }
}
async function doLogin(id){
  const pin=$('pin').value.trim();if(!pin)return;
  $('login-go').disabled=true;$('login-err').textContent='';
  try{const d=await api('login',{userId:id,pin});loggedIn(d);}
  catch(e){$('login-err').textContent=e.code==='offline'?'No connection. Try again.':e.message;$('login-go').disabled=false;$('pin').value='';$('pin').focus();}
}
async function doSetup(id){
  const pin=$('pin').value.trim(),pin2=$('pin2').value.trim(),code=$('setup-code').value.trim();
  if(!/^\d{4,8}$/.test(pin)){$('login-err').textContent='A PIN is 4 to 8 numbers.';return;}
  if(pin!==pin2){$('login-err').textContent='The two PINs do not match.';return;}
  $('login-go').disabled=true;$('login-err').textContent='';
  try{const d=await api('setup',{userId:id,pin,code});loggedIn(d);}
  catch(e){$('login-err').textContent=e.code==='offline'?'No connection. Try again.':e.message;$('login-go').disabled=false;}
}
function loggedIn(d){
  S.token=d.token;S.me=d.me;queue=queue.filter(o=>o.u===d.me.id);saveQueue();lsSet('pjt2_token',S.token);lsSet('pjt2_me',JSON.stringify(S.me));
  $('login').classList.remove('open');tab='';S.jobs=[];S.tasks=[];render();sync(true);
}
function openMeMenu(){
  openModal({title:S.me?S.me.name:'',body:'<p style="font-size:14px;color:var(--ink-light)">Logged in as <b>'+esc(S.me.name)+'</b> on this device.</p>'+(isOwner()?'<p class="form-hint" style="margin-top:8px">To change your own PIN, go to Team & To Dos.</p>':''),
    buttons:[{label:'Log out of this device',cls:'btn-outline',fn:async()=>{if(queue.length&&!confirm(queue.length+' change(s) on this device have not been sent yet and will be lost if you log out now. Log out anyway?'))return;closeModal();queue=[];saveQueue();try{await api('logout');}catch(e){}S.token='';S.me=null;lsDel('pjt2_token');lsDel('pjt2_me');lsDel('pjt2_cache');showLogin();}},{label:'Close',cls:'btn-primary',fn:closeModal}]});
}

// ---------- modal
function openModal(o){
  $('modal-title').textContent=o.title||'';$('modal-body').innerHTML=o.body||'';
  modalFns=(o.buttons||[]).map(b=>b.fn);modalOnClose=o.onClose||null;
  $('modal-footer').innerHTML=(o.buttons||[]).map((b,i)=>'<button class="btn '+(b.cls||'btn-outline')+'" onclick="modalFns['+i+']()">'+esc(b.label)+'</button>').join('');
  $('modal').classList.add('open');
  const f=$('modal-body').querySelector('[data-focus]');if(f)f.focus();
}
function closeModal(){$('modal').classList.remove('open');const c=modalOnClose;modalOnClose=null;if(c)c();if(renderPending)safeRender();}
function modalOpen(){return $('modal').classList.contains('open');}
function isTyping(){const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox';}
function safeRender(){if(modalOpen()||isTyping()){renderPending=true;return;}render();}
document.addEventListener('focusout',()=>{if(renderPending)setTimeout(()=>{if(renderPending)safeRender();},150);});

// ---------- tabs and top level render
function tabsFor(){
  const mine=myListItems().filter(x=>!x.done&&x.date&&x.date<=todayStr()).length;
  const fails=S.jobs.filter(j=>j.status!=='complete'&&openFails(j).length).length;
  const failBadge=fails?'<span class="tab-count red">'+fails+'</span>':'';
  const myBadge=mine?'<span class="tab-count">'+mine+'</span>':'';
  if(isOwner())return [['inspections','📋 Inspections'+failBadge],['jobs','🏠 Houses'],['team','👷 Team & To Dos'],['reports','📊 Reports'],['completed','✅ Completed'],['mylist','📝 My List'+myBadge]];
  return [['mylist','📝 My List'+myBadge],['jobs','🏠 Houses'],['inspections','📋 Inspections'+failBadge],['completed','✅ Completed']];
}
function switchTab(t){tab=t;workDate='';render();window.scrollTo(0,0);}
function render(){
  renderPending=false;
  if(!S.me)return;
  const ae=document.activeElement;const fid=ae&&ae.id&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&!$('modal').contains(ae)&&!$('login').contains(ae)?ae.id:'';
  const fval=fid?ae.value:'';
  renderPages();
  if(fid){const el=$(fid);if(el&&el!==ae){el.value=fval;el.focus();}}
}
function renderPages(){
  const tabs=tabsFor();
  if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  $('tab-bar').innerHTML=tabs.map(t=>'<button class="tab-btn'+(t[0]===tab?' active':'')+'" onclick="switchTab(\''+t[0]+'\')">'+t[1]+'</button>').join('');
  $('me-btn').textContent=S.me.name;
  $('header-sub').textContent='Job Tracker · '+fmtDay(todayStr());
  document.querySelectorAll('.owner-only').forEach(el=>{el.style.display=isOwner()?'':'none';});
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+tab));
  if(tab==='mylist')renderMyList();
  if(tab==='inspections')renderInspections();
  if(tab==='jobs')renderJobs();
  if(tab==='completed')renderCompleted();
  if(tab==='team')renderTeam();
  if(tab==='reports')renderReports();
  if(currentJobId)renderDetail();
  updateQueueBanner();
}

// ---------- shared pieces
function itemDone(it){return (it.entries||[]).reduce((s,e)=>s+(Number(e.n)||0),0);}
function checklistProgress(job){const c=job.checklist||[];let total=0,done=0;c.forEach(it=>{const q=Number(it.qty)||1;total+=q;done+=Math.min(q,itemDone(it));});return {total,done};}
function latestInsp(job,key){let best=null,bi=-1;(job.inspLog||[]).forEach((e,i)=>{if(e.key!==key)return;if(!best||e.date>best.date||(e.date===best.date&&i>bi)){best=e;bi=i;}});return best;}
function openFails(job){return INSP_KEYS.map((k,i)=>{const l=latestInsp(job,k);return l&&l.result==='fail'?{key:k,label:INSP_LABELS[i],entry:l}:null;}).filter(Boolean);}
function cityKey(c){return String(c||'').toUpperCase().replace(/\s+/g,' ').trim();}
function inspUrlFor(job){return safeUrl(job.inspUrl)||safeUrl((S.settings.inspLinks||{})[cityKey(job.city)])||'';}
function cityFull(c){return String(c||'').replace(/^HOU\b/i,'Houston').replace(/^MONT\b/i,'Montgomery');}
function mapsUrl(job){
  const apple=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  const addr=[String(job.address||'').replace(/\([^)]*\)/g,'').replace(/\s+P\d+$/i,'').trim(),cityFull(job.city),job.zip].filter(Boolean).join(', ');
  if(job.pin)return apple?'https://maps.apple.com/?ll='+encodeURIComponent(job.pin)+'&q='+encodeURIComponent(job.address):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(job.pin);
  return apple?'https://maps.apple.com/?q='+encodeURIComponent(addr):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);
}
function workDateBar(){
  const d=wd(),past=d!==todayStr();
  return '<div class="wd'+(past?' past':'')+'"><span>'+(past?'⚠ Logging work for':'Logging work for')+'</span><input type="date" value="'+d+'" max="'+todayStr()+'" onchange="setWorkDate(this.value)">'+
    (past?'<b>'+esc(fmtDay(d))+'</b><button class="btn btn-sm btn-outline" onclick="setWorkDate(\'\')">Back to today</button>':'<span class="muted">Today. Change this when you are catching up on another day.</span>')+'</div>';
}
function setWorkDate(v){workDate=v&&v<todayStr()?v:'';render();}
function entryWho(e){
  let s=esc(e.byName||'')+' · '+esc(fmtShort(e.date));
  if(isOwner()&&e.ts){const t=tsDate(e.ts);if(t&&t!==e.date)s+=' <span title="Real time this was entered">(entered '+esc(fmtShort(t))+')</span>';}
  return s;
}
function checklistRow(job,it,showHouse){
  const q=Number(it.qty)||1,d=Math.min(q,itemDone(it)),done=d>=q;
  const mine=(it.entries||[]).filter(e=>isOwner()||e.by===S.me.id);
  const grouped=[];(it.entries||[]).forEach(e=>{const g=q>1&&grouped.find(x=>x.by===e.by&&x.byName===e.byName&&x.date===e.date&&tsDate(x.ts)===tsDate(e.ts));if(g)g.n+=Number(e.n)||0;else grouped.push(Object.assign({},e,{n:Number(e.n)||0}));});
  const who=grouped.map(e=>(q>1?esc(String(e.n))+' by ':'')+entryWho(e)).join(', ');
  let box;
  if(q===1)box='<div class="cl-box'+(done?' on':'')+'" role="checkbox" aria-checked="'+done+'" onclick="'+(done?'uncheckItem':'checkItem')+'(\''+job.id+'\',\''+it.id+'\')">'+(done?'✓':'')+'</div>';
  else box='<div class="cl-box'+(done?' on':d?' part':'')+'">'+(done?'✓':d||'')+'</div>';
  let side='';
  if(q>1){
    side='<span class="cl-count">'+d+' of '+q+'</span>'+(mine.length&&d?'<button class="icon-btn" title="Undo one" onclick="uncheckItem(\''+job.id+'\',\''+it.id+'\')">−</button>':'')+(done?'':'<button class="btn btn-sm btn-green" onclick="checkItem(\''+job.id+'\',\''+it.id+'\')">+1</button>');
  }
  if(isOwner()&&!showHouse)side+='<button class="icon-btn" title="Edit" onclick="openItemModal(\''+job.id+'\',\''+it.id+'\')">✎</button>';
  let chips='';
  if(it.assignee){const n=it.assignee===S.me.id?'You':userName(it.assignee);chips+='<span class="chip chip-blue">'+esc(n||'Assigned')+(it.due?' · due '+esc(fmtShort(it.due)):'')+'</span>';}
  else if(it.due)chips+='<span class="chip chip-grey">due '+esc(fmtShort(it.due))+'</span>';
  if(it.due&&!done&&it.due<todayStr())chips+='<span class="chip chip-red">past due</span>';
  const house=showHouse?'<span class="house-link" onclick="openDetail(\''+job.id+'\')">'+esc(job.address)+'</span>':'';
  return '<div class="cl-row'+(done?' done':'')+'">'+box+'<div class="cl-main"><div class="cl-text">'+esc(it.text)+'</div><div class="cl-sub">'+house+chips+(who?'<span>'+who+'</span>':'')+'</div></div><div class="cl-side">'+side+'</div></div>';
}
function checkItem(jobId,itemId){
  const job=getJob(jobId);const it=job&&job.checklist.find(x=>x.id===itemId);if(!it)return;
  const entryId=genId('e_'),date=wd();
  mutate('jobOp',{jobId,op:'check',args:{itemId,entryId,n:1,date}},()=>{it.entries.push({id:entryId,by:S.me.id,byName:S.me.name,date,n:1});});
}
function uncheckItem(jobId,itemId){
  const job=getJob(jobId);const it=job&&job.checklist.find(x=>x.id===itemId);if(!it)return;
  const mine=it.entries.filter(e=>isOwner()||e.by===S.me.id);const e=mine[mine.length-1];
  if(!e){toast('Only the person who checked this off, or an owner, can undo it.',true);return;}
  if(!confirm('Undo "'+it.text+'"'+(e.byName?' ('+e.byName+', '+fmtShort(e.date)+')':'')+'?'))return;
  mutate('jobOp',{jobId,op:'uncheck',args:{itemId,entryId:e.id}},()=>{it.entries=it.entries.filter(x=>x!==e);});
}

// ---------- My List
function myListItems(){
  if(!S.me)return [];
  const out=[];
  S.tasks.filter(t=>t.assigneeId===S.me.id).forEach(t=>out.push({type:'task',id:t.id,date:t.date,done:t.done,doneDate:t.doneDate,text:t.text,job:t.jobId?getJob(t.jobId):null,task:t}));
  S.jobs.filter(j=>j.status!=='complete').forEach(j=>(j.checklist||[]).forEach(it=>{if(it.assignee===S.me.id){const done=itemDone(it)>=(Number(it.qty)||1);const last=(it.entries||[]).slice(-1)[0];out.push({type:'item',id:it.id,date:it.due||'',done,doneDate:last?last.date:'',text:it.text,job:j,item:it});}}));
  return out;
}
function taskRow(t,ownerView){
  const job=t.jobId?getJob(t.jobId):null;
  const late=!t.done&&t.date<todayStr();
  return '<div class="cl-row'+(t.done?' done':'')+'"><div class="cl-box'+(t.done?' on':'')+'" role="checkbox" aria-checked="'+!!t.done+'" onclick="toggleTask(\''+t.id+'\')">'+(t.done?'✓':'')+'</div><div class="cl-main"><div class="cl-text">'+esc(t.text)+'</div><div class="cl-sub">'+
    (job?'<span class="house-link" onclick="openDetail(\''+job.id+'\')">'+esc(job.address)+'</span>':'')+
    (late?'<span class="chip chip-red">from '+esc(fmtShort(t.date))+'</span>':'')+
    (t.done?'<span>Done '+esc(fmtShort(t.doneDate))+(ownerView&&t.doneTs&&tsDate(t.doneTs)!==t.doneDate?' (entered '+esc(fmtShort(tsDate(t.doneTs)))+')':'')+'</span>':'')+
    '</div></div>'+(ownerView?'<div class="cl-side"><button class="icon-btn" title="Edit" onclick="openTaskModal(\''+t.id+'\')">✎</button></div>':'')+'</div>';
}
function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const done=!t.done,date=wd();
  mutate('taskToggle',{id,done,date},()=>{t.done=done;t.doneDate=done?date:'';t.doneByName=done?S.me.name:'';});
}
function renderMyList(){
  const today=todayStr(),week=addDays(today,7);
  const items=myListItems();
  const row=x=>x.type==='task'?taskRow(x.task,false):checklistRow(x.job,x.item,true);
  const sec=(title,list,cls)=>list.length?'<div class="list-card"><div class="list-head '+(cls||'')+'">'+title+'<span>'+list.filter(x=>!x.done).length+' open</span></div>'+list.map(row).join('')+'</div>':'';
  const overdue=items.filter(x=>!x.done&&x.date&&x.date<today);
  const todays=items.filter(x=>x.date===today||(x.done&&x.doneDate===today&&x.date!==today&&x.date));
  const soon=items.filter(x=>x.date>today&&x.date<=week).sort((a,b)=>a.date<b.date?-1:1);
  const undated=items.filter(x=>!x.date&&!x.done);
  let h='<div class="section-title">'+esc(S.me.name)+'\'s list</div>'+workDateBar();
  h+=sec('Past due',overdue,'red')+sec('Today · '+esc(fmtDay(today)),todays)+sec('Assigned to you',undated);
  if(soon.length){
    h+='<div class="list-card"><div class="list-head">Coming up this week</div>';
    let last='';soon.forEach(x=>{if(x.date!==last){last=x.date;h+='<div class="muted" style="padding:8px 0 0;font-weight:600">'+esc(fmtDay(x.date))+'</div>';}h+=row(x);});
    h+='</div>';
  }
  if(!overdue.length&&!todays.length&&!soon.length&&!undated.length)h+='<div class="empty-state">Nothing on your list right now.<br>Open a house to check off work you finished.</div>';
  h+='<div class="muted" style="text-align:center;margin-top:6px">Only you and the owners can see this list.</div>';
  $('mylist-body').innerHTML=h;
}

// ---------- House cards
function setJobFilter(f){jobFilter=f;setSeg('job-filter',['all','active','pending','warranty'].indexOf(f));renderJobs();}
function lastWorkDate(job){let d='';(job.log||[]).forEach(l=>{if(l.date>d)d=l.date;});(job.checklist||[]).forEach(it=>(it.entries||[]).forEach(e=>{if(!e.prior&&e.date>d)d=e.date;}));return d;}
function jobCard(job){
  const p=checklistProgress(job);const pct=p.total?Math.round(p.done/p.total*100):0;
  const fails=openFails(job);const passed=INSP_KEYS.filter(k=>job.inspections&&job.inspections[k]).length;

function houseSort(a,b){
  const k=j=>{const m=/^(\d+)\s+(.*)$/.exec(String(j.address||'').trim());return m?[m[2].toUpperCase(),+m[1]]:[String(j.address||'').toUpperCase(),0];};
  const x=k(a),y=k(b);return x[0]<y[0]?-1:x[0]>y[0]?1:x[1]-y[1];
}
function matchJob(j,q){const t=q.toLowerCase();return (j.address||'').toLowerCase().includes(t)||(j.subdivision||'').toLowerCase().includes(t)||(j.city||'').toLowerCase().includes(t)||(j.permit||'').toLowerCase().includes(t);}
function renderJobs(){
  let f=S.jobs.filter(j=>j.status!=='complete').sort(houseSort);

  if(jobSearch)f=f.filter(j=>matchJob(j,jobSearch));
  $('jobs-grid').innerHTML=f.map(jobCard).join('');
  $('jobs-empty').style.display=f.length?'none':'block';

function renderCompleted(){

async function loadPhotos(jobId,force){
  if(photoCache[jobId]&&!force)return;
  try{const d=await api('photos',{jobId});photoCache[jobId]=d.photos;S.photoCounts[jobId]=d.photos.length;if(currentJobId===jobId)renderPhotos();}
  catch(e){if(currentJobId===jobId&&!photoCache[jobId]){const a=$('photo-area');if(a)a.innerHTML='<div class="muted">Photos could not load'+(e.code==='offline'?' (no signal)':'')+'. <a href="#" onclick="loadPhotos(\''+jobId+'\',true);return false">Try again</a></div>';}}
}
function renderPhotos(){
  const a=$('photo-area');if(!a||!currentJobId)return;
  const list=photoCache[currentJobId];
  if(!list){a.innerHTML='<div class="muted">Loading photos...</div>';return;}
  if(!list.length){a.innerHTML='<div class="muted">No photos yet. Everyone on the team can see photos added here.</div>';return;}
  a.innerHTML='<div class="photo-grid">'+list.slice().reverse().map(p=>'<div class="photo-thumb" onclick="viewPhoto(\''+p.id+'\')">'+(p.thumb?'<img alt="" src="data:image/jpeg;base64,'+p.thumb+'">':'')+'<span>'+esc(p.userName)+' · '+esc(fmtShort(p.date))+'</span></div>').join('')+'</div>';
}

function loadImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);res(img);};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};img.src=url;});}
function shrink(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q).split(',')[1];}
function photoFilesPicked(input){
  const jobId=currentJobId;if(!jobId)return;
  const phaseEl=$('photo-phase');const phase=phaseEl?phaseEl.value:'';const date=wd();
  [...input.files].slice(0,12).forEach(file=>{const u={id:genId('p_'),jobId,file,name:file.name,phase,date,state:'waiting'};uploads.push(u);});
  if(input.files.length>12)toast('Only the first 12 photos were added. Upload the rest in a second batch.',true);
  renderUploads();runUploads();
}
let uploading=false;
async function runUploads(){
  if(uploading)return;uploading=true;
  for(;;){
    const u=uploads.find(x=>x.state==='waiting');if(!u)break;
    u.state='sending';renderUploads();
    try{
      if(!u.data){const img=await loadImage(u.file);u.data=shrink(img,1600,0.72);u.thumb=shrink(img,200,0.55);}
      const d=await api('photoAdd',{opId:u.id,photo:{id:u.id,jobId:u.jobId,date:u.date,phase:u.phase},data:u.data,thumb:u.thumb},120000);
      u.state='done';u.data=null;u.file=null;
      if(d.photo){(photoCache[u.jobId]=photoCache[u.jobId]||[]).push(d.photo);S.photoCounts[u.jobId]=(S.photoCounts[u.jobId]||0)+1;}
      else loadPhotos(u.jobId,true);
    }catch(e){u.state='failed';u.error=e.code==='offline'?'No signal':e.message;if(e.code==='auth'){uploading=false;authLost(e.message);return;}}
    renderUploads();if(currentJobId===u.jobId)renderPhotos();
  }
  uploading=false;
}
function retryUpload(id){const u=uploads.find(x=>x.id===id);if(u){u.state='waiting';renderUploads();runUploads();}}
function renderUploads(){
  const el=$('upload-list');if(!el)return;
  const list=uploads.filter(u=>u.jobId===currentJobId&&(u.state!=='done'||Date.now()-(u.doneAt||(u.doneAt=Date.now()))<60000));
  el.innerHTML=list.map(u=>'<div class="up-row"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(u.name||'Photo')+'</span>'+
    (u.state==='done'?'<span class="ok">✓ Uploaded</span>':u.state==='failed'?'<span class="bad">✕ '+esc(u.error||'Failed')+'</span><button class="btn btn-sm btn-primary" onclick="retryUpload(\''+u.id+'\')">Retry</button>':u.state==='sending'?'<span class="muted">Uploading...</span>':'<span class="muted">Waiting</span>')+'</div>').join('');
}

    '<div class="add-row" style="margin:8px 0"><button class="btn btn-primary" onclick="openAddUserModal()">+ Add a person</button></div><div class="form-hint" style="padding-bottom:8px">Changing a PIN or turning someone off logs their phone out right away. Use that for a lost phone or when someone leaves.</div></div>';
  h+='<div class="section-title">Settings</div><div class="list-card" style="padding:12px"><div class="form-group"><label class="form-label">Starter checklist for new houses (one item per line)</label><textarea class="form-textarea" id="set-template" oninput="this.dataset.dirty=1" style="min-height:170px">'+esc((S.settings.checklistTemplate||[]).join('\n'))+'</textarea><div class="form-hint">Changing this only affects houses added from now on. Inspections are tracked in their own section, so they do not need to be on this list.</div></div><button class="btn btn-primary" onclick="saveTemplate()">Save starter checklist</button></div>'+
    '<div class="list-card" style="padding:12px"><label class="form-label">City inspection links</label><div class="form-hint" style="margin-bottom:8px">One link per city. The City Inspection button on each house uses the link for its city.</div>'+knownCities().map((c,i)=>'<div class="form-row" style="margin-bottom:6px;align-items:center"><div style="width:140px;font-weight:600;font-size:13px">'+esc(c)+'</div><input class="form-input" oninput="this.dataset.dirty=1" data-city="'+esc(c)+'" value="'+esc((S.settings.inspLinks||{})[c]||'')+'" placeholder="https://..."></div>').join('')+'<button class="btn btn-primary" style="margin-top:6px" onclick="saveLinks()">Save links</button></div>';
  const tplEl=$('set-template');const tplKeep=tplEl&&tplEl.value!==(S.settings.checklistTemplate||[]).join('\n')&&tplEl.dataset.dirty?tplEl.value:null;
  const linkKeep={};document.querySelectorAll('#team-body input[data-city]').forEach(el=>{if(el.dataset.dirty)linkKeep[el.getAttribute('data-city')]=el.value;});
  $('team-body').innerHTML=h;
  if(tplKeep!=null){$('set-template').value=tplKeep;$('set-template').dataset.dirty='1';}
  document.querySelectorAll('#team-body input[data-city]').forEach(el=>{const k=el.getAttribute('data-city');if(k in linkKeep){el.value=linkKeep[k];el.dataset.dirty='1';}});
}
function setTeamDate(v){teamDate=v;render();}
function addTask(uid){
  const el=$('tt-'+uid);const text=el.value.trim();if(!text)return;
  const task={id:genId('t_'),assigneeId:uid,date:teamDate||todayStr(),text,jobId:$('tj-'+uid).value};el.value='';
  mutate('taskAdd',{task},()=>{S.tasks.push(Object.assign({done:false,doneDate:'',doneByName:''},task));});
}
function openTaskModal(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  openModal({title:'Edit to do',body:
    '<div class="form-group"><label class="form-label">To do</label><input class="form-input" id="tk-text" value="'+esc(t.text)+'"></div>'+
    '<div class="form-row"><div class="form-group"><label class="form-label">For</label><select class="form-select" id="tk-user">'+userOptions(t.assigneeId)+'</select></div><div class="form-group"><label class="form-label">Day</label><input class="form-input" id="tk-date" type="date" value="'+esc(t.date)+'"></div></div>'+
    '<div class="form-group"><label class="form-label">House (optional)</label><select class="form-select" id="tk-job"><option value="">No house</option>'+S.jobs.filter(j=>j.status!=='complete'||j.id===t.jobId).map(j=>'<option value="'+j.id+'"'+(j.id===t.jobId?' selected':'')+'>'+esc(j.address)+'</option>').join('')+'</select></div>'+
    (t.done?'<div class="form-hint">Done '+esc(fmtDate(t.doneDate))+(t.doneByName?' by '+esc(t.doneByName):'')+'.</div>':''),
    buttons:[{label:'Delete',cls:'btn-red',fn:()=>{if(!confirm('Delete this to do?'))return;closeModal();mutate('taskEdit',{id,remove:true},()=>{S.tasks=S.tasks.filter(x=>x.id!==id);});}},{label:'Cancel',fn:closeModal},{label:'Save',cls:'btn-primary',fn:()=>{
      const p={id,text:$('tk-text').value.trim(),assigneeId:$('tk-user').value,date:$('tk-date').value,jobId:$('tk-job').value};
      if(!p.text||!p.date){toast('A to do needs words and a day.',true);return;}
      closeModal();mutate('taskEdit',p,()=>{Object.assign(t,p);});}}]});
}
function openPinModal(uid){
  const u=S.users.find(x=>x.id===uid);if(!u)return;
  openModal({title:(u.hasPin?'Change PIN for ':'Set PIN for ')+u.name,body:'<div class="form-group"><label class="form-label">New PIN (4 to 8 numbers)</label><input class="form-input" id="np-1" data-focus type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div><div class="form-group"><label class="form-label">Again</label><input class="form-input" id="np-2" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div><div class="form-hint">'+(u.id===S.me.id?'Your other devices will need the new PIN.':esc(u.name)+' enters this once on their phone. If they were already logged in, they will be asked for the new PIN.')+'</div>',
    buttons:[{label:'Cancel',fn:closeModal},{label:'Save PIN',cls:'btn-primary',fn:()=>{
      const a=$('np-1').value.trim(),b=$('np-2').value.trim();
      if(!/^\d{4,8}$/.test(a)){toast('A PIN is 4 to 8 numbers.',true);return;}
      if(a!==b){toast('The two PINs do not match.',true);return;}
      closeModal();mutate('userEdit',{userId:uid,pin:a}).then(ok=>{if(ok)toast('PIN saved for '+u.name);});}}]});
}
function setUserActive(uid,on){const u=S.users.find(x=>x.id===uid);if(!u)return;if(!on&&!confirm('Turn off '+u.name+'? Their phone will be logged out and they cannot log back in until you turn them on again.'))return;mutate('userEdit',{userId:uid,active:on});}
function openAddUserModal(){
  openModal({title:'Add a person',body:'<div class="form-group"><label class="form-label">Name</label><input class="form-input" id="nu-name" data-focus></div><div class="form-row"><div class="form-group"><label class="form-label">Role</label><select class="form-select" id="nu-role"><option value="employee">Employee</option><option value="owner">Owner (sees everything)</option></select></div><div class="form-group"><label class="form-label">PIN (4 to 8 numbers)</label><input class="form-input" id="nu-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div></div>',
    buttons:[{label:'Cancel',fn:closeModal},{label:'Add',cls:'btn-primary',fn:()=>{
      const name=$('nu-name').value.trim(),pin=$('nu-pin').value.trim(),role=$('nu-role').value;
      if(!name){toast('Enter a name.',true);return;}
      if(pin&&!/^\d{4,8}$/.test(pin)){toast('A PIN is 4 to 8 numbers.',true);return;}
      closeModal();mutate('userAdd',{name,role,pin:pin||undefined});}}]});
}
function saveTemplate(){const el=$('set-template');const tpl=el.value.split('\n').map(s=>s.trim()).filter(Boolean);delete el.dataset.dirty;mutate('settingsSave',{checklistTemplate:tpl}).then(ok=>{if(ok)toast('Starter checklist saved');});}
function saveLinks(){
  const links={};let bad=false;
  document.querySelectorAll('#team-body input[data-city]').forEach(el=>{const v=el.value.trim();if(v){if(!safeUrl(v))bad=true;else links[el.getAttribute('data-city')]=v;}});
  if(bad){toast('Links must start with https://',true);return;}
  document.querySelectorAll('#team-body input[data-city]').forEach(el=>{delete el.dataset.dirty;});
  mutate('settingsSave',{inspLinks:links},()=>{S.settings.inspLinks=links;}).then(ok=>{if(ok)toast('Links saved');});
}

// ---------- Reports (owners)
const R={from:'',to:'',who:'',job:'',view:'who',data:null,loading:false,error:''};
function weekStart(iso){const p=iso.split('-');const d=new Date(+p[0],+p[1]-1,+p[2]);const dow=(d.getDay()+6)%7;return addDays(iso,-dow);}
function setRange(k){
  const t=todayStr();const f=$('rep-from'),e=$('rep-to');if(f)f.value='';if(e)e.value='';
  if(k==='this'){R.from=weekStart(t);R.to=t;}
  if(k==='last'){R.from=addDays(weekStart(t),-7);R.to=addDays(weekStart(t),-1);}
  if(k==='month'){R.from=t.slice(0,8)+'01';R.to=t;}
  if(k==='30'){R.from=addDays(t,-29);R.to=t;}
  runReport();
}
async function runReport(){
  const f=$('rep-from'),t=$('rep-to');
  if(f&&f.value)R.from=f.value;if(t&&t.value)R.to=t.value;
  if(R.from>R.to){const x=R.from;R.from=R.to;R.to=x;}
  R.loading=true;R.error='';renderReports();
  try{R.data=await api('report',{from:R.from,to:R.to});}catch(e){R.error=e.code==='offline'?'No signal. Reports need a connection.':e.message;}
  R.loading=false;renderReports();
}
function reportRows(){
  const d=R.data;if(!d)return {head:[],rows:[],groups:false};
  const inRange=x=>x>=R.from&&x<=R.to;
  const whoOk=n=>!R.who||n===R.who;const jobOk=id=>!R.job||id===R.job;
  if(R.view==='who'||R.view==='house'){
    let acts=d.activity.filter(a=>a.kind!=='Inspection'&&whoOk(a.userName)&&jobOk(a.jobId));
    // several photos by one person at one house on one day read as one line
    const merged=[],seen={};
    acts.forEach(a=>{if(a.kind==='Photo'){const k=a.userName+'|'+a.date+'|'+a.jobId;if(seen[k]){seen[k].n++;return;}const c=Object.assign({n:1},a);seen[k]=c;merged.push(c);}else merged.push(a);});
    merged.forEach(a=>{if(a.kind==='Photo')a.detail=a.n+' photo'+(a.n===1?'':'s')+' added';});
    // counted checklist work by one person on one day reads as one line, like "Toilets set (3)"
    const counted={};
    for(let i=merged.length-1;i>=0;i--){const a=merged[i];const m=a.kind==='Checklist'&&/^(.*) \((\d+)\)$/.exec(a.detail);if(!m)continue;const k=a.userName+'|'+a.date+'|'+a.jobId+'|'+m[1]+'|'+tsDate(a.ts);if(counted[k]){counted[k].c+=+m[2];counted[k].row.detail=m[1]+' ('+counted[k].c+')';merged.splice(i,1);}else{merged[i]=Object.assign({},a);counted[k]={row:merged[i],c:+m[2]};}}
    const lateFlag=a=>{const t=tsDate(a.ts);return t&&t!==a.date?fmtShort(t):'';};
    if(R.view==='who'){
      merged.sort((a,b)=>a.userName.localeCompare(b.userName)||(a.date<b.date?-1:a.date>b.date?1:0)||a.address.localeCompare(b.address));
      return {head:['Employee','Date','House','Type','What','Entered later'],rows:merged.map(a=>[a.userName||'(unknown)',fmtDay(a.date),a.address||'(no house)',a.kind,a.detail,lateFlag(a)]),groups:true};
    }
    merged.sort((a,b)=>a.address.localeCompare(b.address)||(a.date<b.date?-1:a.date>b.date?1:0)||a.userName.localeCompare(b.userName));
    return {head:['House','Date','Employee','Type','What','Entered later'],rows:merged.map(a=>[a.address||'(no house)',fmtDay(a.date),a.userName||'(unknown)',a.kind,a.detail,lateFlag(a)]),groups:true};
  }
  if(R.view==='fails'){
    const rows=[];
    S.jobs.forEach(j=>{if(!jobOk(j.id))return;(j.inspLog||[]).forEach(e=>{if(e.result!=='fail'||!inRange(e.date))return;
      const later=(j.inspLog||[]).filter(x=>x.key===e.key&&x.result==='pass'&&x.date>=e.date).sort((a,b)=>a.date<b.date?-1:1)[0];
      rows.push([j.address,INSP_LABELS[INSP_KEYS.indexOf(e.key)],fmtDay(e.date),e.note||'',later?'Passed '+fmtShort(later.date):'Still open',e.byName||'',e.date]);});});
    rows.sort((a,b)=>a[6]<b[6]?1:-1);
    return {head:['House','Inspection','Failed on','Why it failed','Since then','Entered by'],rows:rows.map(r=>r.slice(0,6)),groups:false};
  }
  // assigned versus completed
  const rows=[];const today=todayStr();
  d.tasks.forEach(t=>{const n=userName(t.assigneeId)||'(unknown)';if(!whoOk(n)||(R.job&&t.jobId!==R.job))return;const j=t.jobId?getJob(t.jobId):null;
    rows.push([n,fmtDay(t.date),j?j.address:'',t.text,'To do',t.done?'Done '+fmtShort(t.doneDate):(t.date<today?'PAST DUE':'Open'),t.date]);});
  S.jobs.forEach(j=>{if(!jobOk(j.id))return;(j.checklist||[]).forEach(it=>{if(!it.assignee||!it.due||!inRange(it.due))return;const n=userName(it.assignee)||'(unknown)';if(!whoOk(n))return;
    const done=itemDone(it)>=(Number(it.qty)||1);const last=(it.entries||[]).slice(-1)[0];
    rows.push([n,fmtDay(it.due),j.address,it.text,'House checklist',done?'Done '+fmtShort(last?last.date:'')+(last&&last.byName&&last.byName!==n?' by '+last.byName:''):(it.due<today?'PAST DUE':'Open'),it.due]);});});
  rows.sort((a,b)=>a[0].localeCompare(b[0])||(a[6]<b[6]?-1:a[6]>b[6]?1:0));
  return {head:['Employee','Day','House','Assigned','Type','Status'],rows:rows.map(r=>r.slice(0,6)),groups:true};
}
function renderReports(){
  if(!isOwner()){$('reports-body').innerHTML='';return;}
  if(!R.from){const t=todayStr();R.from=weekStart(t);R.to=t;}
  const views=[['who','Who worked on what'],['house','By house'],['fails','Failed inspections'],['assigned','Assigned vs completed']];
  let h='<div class="section-title">Reports</div><div class="no-print"><div class="toolbar" style="justify-content:flex-start"><div class="seg">'+[['this','This week'],['last','Last week'],['month','This month'],['30','Last 30 days']].map(p=>'<button onclick="setRange(\''+p[0]+'\')">'+p[1]+'</button>').join('')+'</div>'+
    '<input type="date" class="search-input" style="max-width:160px;flex:none" id="rep-from" value="'+R.from+'" onchange="R.from=this.value"><span class="muted">to</span><input type="date" class="search-input" style="max-width:160px;flex:none" id="rep-to" value="'+R.to+'" onchange="R.to=this.value"><button class="btn btn-primary" onclick="runReport()">Run report</button></div>'+
    '<div class="toolbar" style="justify-content:flex-start"><select class="search-input" style="max-width:190px;flex:none" onchange="R.who=this.value;renderReports()"><option value="">Everyone</option>'+S.users.map(u=>'<option'+(R.who===u.name?' selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select>'+
    '<select class="search-input" style="max-width:260px;flex:none" onchange="R.job=this.value;renderReports()"><option value="">All houses</option>'+S.jobs.slice().sort(houseSort).map(j=>'<option value="'+j.id+'"'+(R.job===j.id?' selected':'')+'>'+esc(j.address)+'</option>').join('')+'</select>'+
    '<div class="seg">'+views.map(v=>'<button class="'+(R.view===v[0]?'on':'')+'" onclick="R.view=\''+v[0]+'\';renderReports()">'+v[1]+'</button>').join('')+'</div></div></div>';
  if(R.loading)h+='<div class="empty-state">Loading report...</div>';
  else if(R.error)h+='<div class="empty-state">'+esc(R.error)+'</div>';
  else if(!R.data)h+='<div class="empty-state">Pick the dates and tap Run report.<br><span class="muted">Only owners can see reports.</span></div>';
  else{
    const t=reportRows();const title=views.find(v=>v[0]===R.view)[1];
    h+='<div class="toolbar"><div><b>'+esc(title)+'</b> <span class="muted">'+esc(fmtDate(R.data.from))+' to '+esc(fmtDate(R.data.to))+(R.who?' · '+esc(R.who):'')+' · '+t.rows.length+' line'+(t.rows.length===1?'':'s')+'</span></div><div class="no-print" style="display:flex;gap:6px"><button class="btn btn-outline" onclick="exportReport()">⬇ Export for Excel</button><button class="btn btn-outline" onclick="window.print()">🖨 Print</button></div></div>';
    if(!t.rows.length)h+='<div class="empty-state">Nothing recorded for these dates.</div>';
    else{
      h+='<div class="master-table-wrap"><table class="rep-table"><thead><tr>'+t.head.slice(t.groups?1:0).map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';
      let last=null;
      t.rows.forEach(r=>{
        if(t.groups&&r[0]!==last){last=r[0];const n=t.rows.filter(x=>x[0]===last).length;h+='<tr class="rep-group"><td colspan="'+(t.head.length-1)+'">'+esc(last)+' <span class="muted" style="font-weight:400">'+n+' line'+(n===1?'':'s')+'</span></td></tr>';}
        h+='<tr>'+r.slice(t.groups?1:0).map(c=>'<td'+(/PAST DUE|Still open/.test(c)?' style="color:var(--red);font-weight:600"':'')+'>'+esc(c)+'</td>').join('')+'</tr>';
      });
      h+='</tbody></table></div>';
    }
  }
  $('reports-body').innerHTML=h;
}
function exportReport(){
  const t=reportRows();if(!t.rows.length){toast('Nothing to export.',true);return;}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='﻿'+[t.head].concat(t.rows).map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='crown-elite-'+R.view+'-'+R.from+'-to-'+R.to+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

// ---------- start up
$('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
window.addEventListener('online',()=>{if(queue.length)flush();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.token&&Date.now()-lastSync>60000)sync();});
setInterval(()=>{if(queue.length&&!flushing)flush();},30000);
(function boot(){
  S.token=lsGet('pjt2_token')||'';
  try{S.me=JSON.parse(lsGet('pjt2_me')||'null');}catch(e){S.me=null;}
  try{queue=JSON.parse(lsGet('pjt2_queue')||'[]')||[];}catch(e){queue=[];}
  if(S.token&&S.me){
    try{const c=JSON.parse(lsGet('pjt2_cache')||'null');if(c){S.jobs=c.jobs||[];S.tasks=c.tasks||[];S.settings=c.settings||S.settings;S.users=c.users||[];S.team=c.team||[];S.photoCounts=c.photoCounts||{};}}catch(e){}
    render();sync();
  }else showLogin();
})();
</script>
